name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: src-tauri/Cargo.toml

jobs:
  build-linux:
    name: Linux bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Tauri system dependencies
        timeout-minutes: 15
        env:
          APT_OPTS: -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            libfuse2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.7.5
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build DEB and AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles deb,appimage

      - name: Collect stable artifact names
        run: node scripts/collect-release.mjs linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  build-windows:
    name: Windows bundles
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.7.5
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build NSIS and MSI
        run: npm run tauri build -- --bundles nsis,msi

      - name: Collect stable artifact names
        run: node scripts/collect-release.mjs windows

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes from CHANGELOG
        run: node scripts/changelog-section.mjs > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: false
