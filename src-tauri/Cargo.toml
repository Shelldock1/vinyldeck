[package]
name = "vinyldeck"
version = "0.2.0"
description = "A cinematic vinyl experience for everything playing on your computer."
authors = ["VinylDeck"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vinyldeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
base64 = "0.22"
anyhow = "1"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
sys-locale = "0.3"
# Shared HTTP client: MPRIS artwork on Linux and the manual release check.
ureq = { version = "2", default-features = false, features = ["tls"] }

# Linux: MPRIS over the session D-Bus (Spotify, browsers, VLC, ...)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"] }

# Windows-specific WinRT bindings for SMTC
[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
  "Media_Control",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media",
  "Media_MediaProperties",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
