<style>
        body {
            background-color: #000;
            overflow: hidden; /* Prevent scrolling for the mini-player feel */
            perspective: 1000px;
        }

        /* Ambient Orbs Animations - Smooth Interpolation */
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(100px, 50px) scale(1.2); opacity: 0.6; }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(-80px, -100px) scale(0.8); opacity: 0.5; }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            50% { transform: translate(50px, -50px) scale(1.3); opacity: 0.6; }
        }

        /* Acrylic Panel with Gloss Reflection */
        .acrylic-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
        }

        .glass-reflection {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: reflectionShift 12s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes reflectionShift {
            0% { opacity: 0.2; transform: translateX(-30%) translateY(-30%) rotate(-10deg); }
            100% { opacity: 0.5; transform: translateX(30%) translateY(30%) rotate(10deg); }
        }

        /* Etched Icons & Magnetic UI */
        .etched-icon {
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s, text-shadow 0.3s;
        }
        .etched-icon:hover {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            transform: scale(1.2) translateY(-2px);
        }

        .magnetic-play {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s, box-shadow 0.3s;
        }
        .magnetic-play:hover {
            transform: scale(1.15) translateY(-4px);
            background-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
        }

        /* Vinyl Sheen */
        .vinyl-sheen {
            background: conic-gradient(
                from 90deg at 50% 50%,
                rgba(255,255,255,0.05) 0deg,
                rgba(255,255,255,0.2) 45deg,
                rgba(255,255,255,0.05) 90deg,
                rgba(255,255,255,0.2) 135deg,
                rgba(255,255,255,0.05) 180deg,
                rgba(255,255,255,0.2) 225deg,
                rgba(255,255,255,0.05) 270deg,
                rgba(255,255,255,0.2) 315deg,
                rgba(255,255,255,0.05) 360deg
            );
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* Iridescent Shimmer */
        @keyframes shimmerRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .vinyl-shimmer {
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(6, 182, 212, 0.15) 90deg,
                transparent 180deg,
                rgba(217, 70, 239, 0.15) 270deg,
                transparent 360deg
            );
            mix-blend-mode: screen;
            pointer-events: none;
            animation: shimmerRotate 12s linear infinite reverse;
        }

        /* Grooves */
        .vinyl-grooves {
            background-image: 
                repeating-radial-gradient(
                    circle at center,
                    transparent 0,
                    transparent 2px,
                    rgba(255, 255, 255, 0.05) 3px,
                    transparent 4px
                );
        }

        /* Slider - Precision Motion */
        .slider-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            height: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        .slider-fill {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px 3px rgba(255, 255, 255, 0.7);
            height: 100%;
            border-radius: 999px;
            width: 35%; /* Simulated progress */
            position: absolute;
            left: 0;
            top: 0;
            transition: width 0.1s linear;
        }
        .slider-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 10px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%);
            filter: blur(2px);
        }
        .slider-thumb {
            position: absolute;
            top: 50%;
            left: 35%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 10px rgba(255,255,255,0.8);
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.3s;
        }
        .slider-track:hover .slider-thumb {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex items-center justify-center p-8 relative">

</div>

</div>
</div>
<!-- Track Info -->
<div class="flex flex-col items-center text-center z-10 gap-1 relative">

</div>
<!-- Progress Bar -->
<div class="flex flex-col gap-2 z-10 w-full px-2 relative group/slider">
<div class="slider-track overflow-visible">
<div class="slider-fill"></div>
<div class="slider-thumb"></div>
</div>
<div class="flex justify-between w-full mt-1">
<span class="font-label-caps text-label-caps text-on-surface-variant/80 transition-colors duration-300 group-hover/slider:text-white">1:24</span>
<span class="font-label-caps text-label-caps text-on-surface-variant/80 transition-colors duration-300 group-hover/slider:text-white">-3:12</span>
</div>
</div>
<!-- Controls -->
<div class="flex justify-between items-center w-full px-4 z-10 relative">
<button class="etched-icon">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">shuffle</span>
</button>
<button class="etched-icon">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<!-- Play/Pause (Emphasized with Magnetic Physics) -->
<button class="magnetic-play w-16 h-16 rounded-full bg-white/10 border border-white/20 flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.1)] backdrop-blur-xl z-20 relative">
<span class="material-symbols-outlined text-[40px] text-primary drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>

<button class="etched-icon">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
<button class="etched-icon">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">repeat</span>

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">volume_up</span>

<button class="etched-icon flex items-center gap-2">
