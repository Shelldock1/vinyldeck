<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VinylDeck - Mini Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            extend: {
              "colors": {

                      "outline-variant": "#44474a",
                      "on-secondary": "#303030",
                      "on-primary-fixed": "#161c22",
                      "primary-container": "#dde3eb",
                      "inverse-primary": "#595f66",
                      "background": "#131314",
                      "on-tertiary-fixed": "#241a11",
                      "surface-container-high": "#2a2a2a",
                      "on-tertiary": "#3a2e24",
                      "tertiary-fixed-dim": "#d6c3b5",
                      "on-secondary-fixed-variant": "#474747",
                      "surface-variant": "#353535",

                      "on-primary-container": "#5f656c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "touch-target": "48px",
                      "gutter": "24px",
                      "unit": "8px",
                      "container-padding": "32px"
              },
              "fontFamily": {
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "headline-lg": [
                              "Sora"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Sora"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Sora"
                      ]
              },
              "fontSize": {
                      "label-caps": [
                              "12px",

                                      "lineHeight": "1.0",

                      ],
                      "headline-lg": [

                      ],
                      "display-lg": [

                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "1.6",
                                      "letterSpacing": "0.01em",

                      "headline-md": [

                                      "lineHeight": "1.3",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"

                      ]
              }
      },
          },
        }

<style>
        .spin {
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fade-in-up 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(255, 255, 255, 0.4); opacity: 0.8; }
            50% { box-shadow: 0 0 20px rgba(255, 255, 255, 1); opacity: 1; }
        }
        .progress-bar-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
        }
        .orb-1 {
            animation: drift 15s ease-in-out infinite;
        }
        .orb-2 {
            animation: drift 20s ease-in-out infinite reverse;
        }

        .glass-panel {
            background-color: rgba(19, 19, 20, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .glow-accent {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.02;
            z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
      </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden">
<!-- Background environment -->
<div class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1614613535808-3196b28bfcac?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=2000&amp;q=80')] bg-cover bg-center opacity-30 blur-sm" data-alt="A dimly lit, luxurious listening room with high-end analog audio equipment. Deep shadows, subtle warm glowing lights reflecting off brushed metal surfaces and vinyl records. Cinematic, moody atmosphere focusing on the texture and form of the hardware. Dark, atmospheric, high-fidelity aesthetic."></div>
<div class="absolute inset-0 z-0 bg-gradient-to-b from-black/60 to-black/90"></div>
<!-- Drifting Color Orbs -->
<div class="absolute top-[15%] left-[20%] w-[35vw] h-[35vw] bg-purple-900/20 rounded-full blur-[80px] z-0 orb-1 pointer-events-none"></div>
<div class="absolute bottom-[15%] right-[20%] w-[45vw] h-[45vw] bg-blue-900/20 rounded-full blur-[100px] z-0 orb-2 pointer-events-none"></div>
<!-- Mini Player Container -->
<div class="relative z-10 w-[320px] h-[520px] rounded-[32px] glass-panel overflow-hidden flex flex-col shadow-[0_20px_50px_rgba(0,0,0,0.5)] animate-float">
<div class="noise-overlay"></div>
<!-- Vertical Progress Line -->
<div class="absolute left-0 top-0 bottom-0 w-[4px] bg-white/10 z-20">
<div class="w-full bg-primary h-[45%] progress-bar-glow rounded-r-full transition-all duration-300"></div>
</div>
<!-- Top Half: Spinning Vinyl -->
<div class="relative h-[280px] w-full flex items-center justify-center bg-gradient-to-b from-white/5 to-transparent border-b border-white/5">
<!-- Vinyl Record -->
<div class="relative w-[220px] h-[220px] rounded-full bg-[#111] border border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.8)] spin flex items-center justify-center">
<!-- Grooves -->
<div class="absolute inset-1 rounded-full border border-white/5"></div>
<div class="absolute inset-3 rounded-full border border-white/5"></div>
<div class="absolute inset-5 rounded-full border border-white/5"></div>
<div class="absolute inset-8 rounded-full border border-white/5"></div>
<div class="absolute inset-12 rounded-full border border-white/5"></div>
<!-- Center Label (Album Art) -->
<div class="relative w-[80px] h-[80px] rounded-full overflow-hidden border-2 border-[#111]">
<img alt="Album Art" class="w-full h-full object-cover" data-alt="Close up of a spinning vinyl record center label. The label features abstract, geometric artwork in deep reds and blacks. The texture of the paper label and the vinyl grooves surrounding it are highly detailed. Atmospheric, dramatic lighting highlighting the circular motion and physical texture. Premium hi-fi aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxxULoi0zt7tPbtSs7DfEO1QHFkrLdoyb9PZsCcx9RPTWu4r8D9ZRLXv4jYkotTXjymRLtMMAXq5aDxucbhLqYfBfP__rCobBvqfhBhAIi8tj2MeCV8OyPLi0hi8-yyEU4qDRYUiqcsKMMCUq0X-Oq6Z_dZDqpnsKZYLiFs7u54IEE28-eLagBGODT2c4_ktgDaJ9ejecpn8dvFlFpuQgJ5gNoHu4lW1WDclnNkppxlqy6a50DPKJHpExywstgUjTyZhwa29RehblH">
<!-- Spindle Hole -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-black rounded-full border border-white/20"></div>
</div>
<!-- Reflection Highlight -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/5 to-transparent pointer-events-none"></div>
</div>
<!-- Stylized Tonearm Hint -->
<div class="absolute right-[-20px] top-4 w-[60px] h-[180px] opacity-40">
<div class="w-2 h-full bg-gradient-to-r from-gray-500 to-gray-300 rounded-full rotate-[15deg] transform origin-top blur-[0.5px]"></div>
</div>
</div>
<!-- Bottom Half: Info & Controls -->
<div class="flex-1 flex flex-col justify-between p-6 pl-8 animate-fade-in-up">
<!-- Track Info -->
<div class="flex flex-col space-y-1">
<h3 class="font-headline-md text-headline-md text-primary truncate drop-shadow-md">Midnight City</h3>
<p class="font-body-md text-body-md text-on-surface-variant truncate">M83 • Hurry Up, We're Dreaming</p>
</div>
<!-- Controls -->
<div class="flex flex-col space-y-6 mb-2">
<!-- Time -->
<div class="flex justify-between items-center w-full">
<span class="font-label-caps text-label-caps text-primary tracking-widest">02:14</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">-01:49</span>
</div>
<!-- Main Buttons -->
<div class="flex justify-between items-center w-full px-2">
<button class="text-on-surface-variant hover:text-primary transition-colors hover:scale-110 active:scale-95">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">skip_previous</span>
</button>
<button class="w-[64px] h-[64px] rounded-full bg-primary text-on-primary flex items-center justify-center glow-accent hover:scale-105 active:scale-95 transition-all shadow-xl">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors hover:scale-110 active:scale-95">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">skip_next</span>
</button>
</div>
<!-- Secondary Actions -->
<div class="flex justify-between items-center w-full px-4 mt-2 border-t border-white/5 pt-4">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">favorite</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">queue_music</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
