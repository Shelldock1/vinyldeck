<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VinylDeck - Glass Theme</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "background": "#131314",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#353535",
                    "on-secondary-container": "#b5b5b5",
                    "on-secondary-fixed": "#1b1b1b",
                    "on-secondary": "#303030",
                    "on-tertiary-fixed-variant": "#51443a",
                    "primary-fixed-dim": "#c1c7cf",
                    "on-surface-variant": "#c5c6cb",
                    "primary-fixed": "#dde3eb",
                    "tertiary-container": "#f3dfd0",
                    "on-error": "#690005",
                    "error-container": "#93000a",
                    "surface-container-high": "#2a2a2a",
                    "surface-container-highest": "#353535",
                    "outline": "#8e9195",
                    "outline-variant": "#44474a",
                    "secondary-container": "#474747",
                    "secondary-fixed": "#e2e2e2",
                    "primary": "#ffffff",
                    "on-tertiary-container": "#706256",
                    "surface-container-low": "#1b1b1c",
                    "surface": "#131314",
                    "surface-container": "#201f20",
                    "tertiary-fixed": "#f3dfd0",
                    "on-primary": "#2b3137",
                    "surface-tint": "#c1c7cf",
                    "tertiary": "#ffffff",
                    "on-secondary-fixed-variant": "#474747",
                    "inverse-on-surface": "#313031",
                    "on-primary-fixed": "#161c22",
                    "on-tertiary": "#3a2e24",
                    "surface-dim": "#131314",
                    "on-primary-container": "#5f656c",
                    "surface-container-lowest": "#0e0e0f",
                    "on-surface": "#e5e2e2",
                    "tertiary-fixed-dim": "#d6c3b5",
                    "secondary": "#c6c6c6",
                    "on-primary-fixed-variant": "#41474e",
                    "inverse-primary": "#595f66",
                    "inverse-surface": "#e5e2e2",
                    "secondary-fixed-dim": "#c6c6c6",
                    "primary-container": "#dde3eb",
                    "error": "#ffb4ab",
                    "on-tertiary-fixed": "#241a11",
                    "surface-bright": "#393939",
                    "on-background": "#e5e2e2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-padding": "32px",
                    "touch-target": "48px",
                    "unit": "8px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-md": ["Sora"],
                    "headline-lg": ["Sora"],
                    "display-lg": ["Sora"],
                    "body-lg": ["Inter"],
                    "label-caps": ["JetBrains Mono"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.2em", "fontWeight": "500"}]
            }
          }
        }
      }
    </script>
<style>
        /* Custom animations & Glassmorphism utilities */
        .glass-panel {
            background: rgba(19, 19, 20, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        .spin-slow {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .ambient-orb-1 {
            background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, rgba(0,0,0,0) 70%);
            animation: float 15s ease-in-out infinite alternate;
        }
        
        .ambient-orb-2 {
            background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(0,0,0,0) 70%);
            animation: float 20s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5vw, -5vh) scale(1.1); }
            100% { transform: translate(-5vw, 5vh) scale(0.9); }
        }

        /* Prevent scroll on body to maintain app-like feel */
        body {
            overflow: hidden;
            background-color: #000;
        }
    </style>
</head>
<body class="text-on-background bg-background font-body-md min-h-screen relative overflow-hidden flex flex-col items-center justify-center">
<!-- Ambient Background Layer -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-80 mix-blend-screen">
<div class="absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] rounded-full ambient-orb-1 blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[70vw] h-[70vw] rounded-full ambient-orb-2 blur-3xl"></div>
</div>
<!-- Main App Container (16:9 Aspect Ratio Focus) -->
<main class="relative z-10 w-full max-w-7xl aspect-[16/9] md:h-auto h-screen max-h-screen flex flex-col justify-between glass-panel md:rounded-[2rem] overflow-hidden shadow-2xl border-white/5">
<!-- TopAppBar (Web & Mobile unified for this specific immersive view) -->
<header class="fixed md:absolute top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding pt-8 pb-4 bg-transparent no-border flat no shadows">
<div class="font-display-lg text-display-lg tracking-tighter text-primary uppercase">
                VinylDeck
            </div>
<nav class="flex gap-6 items-center">
<button class="text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">palette</span>
</button>
<button class="text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">queue_music</span>
</button>
<button class="text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">fullscreen</span>
</button>
<button class="text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</nav>
</header>
<!-- Canvas / Stage (Central Vinyl Record) -->
<section class="flex-grow flex items-center justify-center relative mt-20 mb-24 z-20">
<!-- Vinyl Record Element -->
<div class="relative w-[614px] h-[614px] max-w-[500px] max-h-[500px] rounded-full spin-slow group cursor-pointer shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
<!-- Record Grooves Base -->
<div class="absolute inset-0 rounded-full bg-[#0a0a0a] border border-[#2a2a2a] overflow-hidden">
<!-- Subtle vinyl groove texture via CSS -->
<div class="absolute inset-0 rounded-full" style="background: repeating-radial-gradient(#111 0px, #111 2px, #0a0a0a 3px, #0a0a0a 4px);"></div>
<!-- Volumetric Highlight -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/5 to-transparent mix-blend-overlay"></div>
</div>
<!-- Center Label (Frosted Glass) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-1/3 h-1/3 rounded-full glass-panel flex items-center justify-center shadow-inner">
<div class="w-4 h-4 rounded-full bg-[#1a1a1a] border border-white/20 shadow-inner"></div>
</div>
</div>
<!-- Floating Controls Overlay -->
<div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel px-8 py-4 rounded-full flex items-center gap-8">
<button class="text-on-surface opacity-70 hover:opacity-100 hover:text-white transition-all active:scale-90">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center hover:scale-105 hover:shadow-[0_0_20px_rgba(255,255,255,0.4)] transition-all active:scale-95">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-on-surface opacity-70 hover:opacity-100 hover:text-white transition-all active:scale-90">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
</section>
<!-- BottomNavBar (Mobile & Desktop App-like Bottom Nav) -->
<footer class="fixed md:absolute bottom-0 left-0 w-full z-50 flex justify-around items-center h-touch-target px-gutter pb-safe bg-surface/10 backdrop-blur-xl border-t border-white/10 shadow-2xl rounded-b-[2rem] md:rounded-none">
<button class="flex flex-col items-center justify-center text-primary drop-shadow-[0_0_8px_rgba(255,255,255,0.8)] translate-y-[-2px] transition-transform w-24">
<span class="material-symbols-outlined mb-1 text-[24px]" style="font-variation-settings: 'FILL' 1;">album</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-[10px]">Player</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-50 hover:opacity-100 hover:text-primary transition-opacity w-24 group">
<span class="material-symbols-outlined mb-1 text-[24px] group-active:scale-90 transition-transform" style="font-variation-settings: 'FILL' 0;">library_music</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-[10px]">Collection</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-50 hover:opacity-100 hover:text-primary transition-opacity w-24 group">
<span class="material-symbols-outlined mb-1 text-[24px] group-active:scale-90 transition-transform" style="font-variation-settings: 'FILL' 0;">graphic_eq</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-[10px]">Mixes</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-50 hover:opacity-100 hover:text-primary transition-opacity w-24 group">
<span class="material-symbols-outlined mb-1 text-[24px] group-active:scale-90 transition-transform" style="font-variation-settings: 'FILL' 0;">explore</span>
<span class="font-label-caps text-label-caps uppercase tracking-widest text-[10px]">Discovery</span>
</button>
</footer>
</main>
</body></html>
