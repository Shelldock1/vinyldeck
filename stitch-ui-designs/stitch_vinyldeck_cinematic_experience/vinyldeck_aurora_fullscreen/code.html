<style>
        body {
            background-color: #050b14; /* Deep midnight cyan base */
            overflow: hidden;
        }
        
        /* Particle effects */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.4);
            filter: blur(2px);
            pointer-events: none;
        }

        /* Vinyl Grooves */
        .vinyl-grooves {
            background: repeating-radial-gradient(
                #111 0px,
                #222 2px,
                #111 4px
            );
            mask-image: radial-gradient(circle, transparent 30%, black 100%);
            -webkit-mask-image: radial-gradient(circle, transparent 30%, black 100%);
        }

        /* Neon Ring Progress */
        .neon-ring {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5), inset 0 0 20px rgba(0, 240, 255, 0.5);
        }

        /* Hidden UI Hover area */
        .ui-reveal-area {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .ui-reveal-area:hover, .ui-reveal-area:focus-within {
            opacity: 1;
        }

        /* Tonearm metallic finish */
        .tonearm {
            background: linear-gradient(90deg, #333 0%, #888 50%, #333 100%);
            box-shadow: -5px 0 15px rgba(0,0,0,0.8), inset 2px 0 5px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="text-on-surface font-body-md h-screen w-screen relative flex items-center justify-center">
<!-- Atmospheric Background -->
<div class="absolute inset-0 z-0 overflow-hidden">
<!-- Oversized blurred album art base -->
<img alt="Atmospheric Background" class="absolute inset-0 w-full h-full object-cover opacity-30 filter blur-3xl scale-110" data-alt="Abstract fluid art in deep midnight cyan and electric blue hues, creating a cosmic, ethereal atmosphere. The textures are smooth and glowing, blending seamlessly to form a dark luxury backdrop suitable for high-end digital audio interfaces." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDT4yWdddYsbo3N3NbLsPgI9rkRen1oPAjqu22uU420eQpiVPBTlBv-1P8m_Z-K-YGMS1yxySXXVjEYF6q3BSg7lkvKsGAV87o6T2S9Vme9kftzztQi8FG4bUbr8Y79F67pcT8-W_OsvAWlgWQDeVRP42mHGsh9pYIknBNT3X26bfu6sP0X6lnarnu9UTY5-5-686AAY6d7L4bTHlFI7awvs4VfOXduK5f68Pk9cYZ7zdt8C4loWEItte30NZ4O0bWJmUt1Qxc0bUaO">
<!-- Glowing Orbs -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-aurora-cyan rounded-full mix-blend-screen opacity-40 blur-[100px] animate-float"></div>
<div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-aurora-teal rounded-full mix-blend-screen opacity-30 blur-[120px] animate-float" style="animation-delay: 2s;"></div>
<!-- Drifting Particles (Generated via JS) -->
<div class="absolute inset-0" id="particles-container"></div>
</div>
<!-- Main Stage: Centerpiece Vinyl -->
<div class="relative z-10 w-[600px] h-[600px] flex items-center justify-center group">
<!-- Neon Progress Ring -->
<div class="absolute inset-0 rounded-full border border-aurora-cyan/30 neon-ring scale-105 pointer-events-none">
<!-- Active progress arc (simulated with conic gradient) -->
<div class="absolute inset-0 rounded-full" style="background: conic-gradient(from 0deg, #00f0ff 0%, #00f0ff 65%, transparent 65%, transparent 100%); mask-image: radial-gradient(transparent 98%, black 100%); -webkit-mask-image: radial-gradient(transparent 98%, black 100%);"></div>
</div>
<!-- The Vinyl Record -->
<div class="w-full h-full rounded-full bg-black shadow-[0_0_100px_rgba(0,0,0,0.9)] relative flex items-center justify-center animate-spin-slow overflow-hidden border-[0.5px] border-white/5">
<!-- Grooves -->
<div class="absolute inset-0 vinyl-grooves opacity-60"></div>
<!-- Vinyl highlights (light reflection) -->
<div class="absolute inset-0 rounded-full" style="background: conic-gradient(from 45deg, transparent 0%, rgba(255,255,255,0.05) 10%, transparent 20%, transparent 40%, rgba(255,255,255,0.05) 50%, transparent 60%);"></div>
<!-- Record Label (Album Art) -->
<div class="w-[200px] h-[200px] rounded-full border border-surface-variant/30 overflow-hidden relative shadow-inner z-20">
<img alt="Album Art Label" class="w-full h-full object-cover" data-alt="A striking minimalist album cover featuring a dark, metallic geometric shape illuminated by a single beam of cyan neon light. The design is sleek, modern, and embodies dark luxury audio aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCy42SjeTgCm68bMgSkiUUIgQxFHfhjX60RPDqgIQ5HM0b6qea9krpYkDmQSHweQOdI7USAB8e-ChXzJhXGivT-ISZ4C3Edg8ZevFsksXZd0pcLpOndllnFZqdGM3K0Y2J16hjavHPj341Lyw8tSzG3eMkedGJuvyUU1qve4tSZ2X8Dq-4tIKJPJabDYmi12nqCd-zKaftKPt5geUy7Wsdirzz7aJESPHuCDeE9C_V-1TPUXzftWcRAapf3EfmO-P_WnIuNBGBp9H09">
<!-- Spindle hole -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-[#1a1a1a] rounded-full shadow-[inset_0_2px_4px_rgba(0,0,0,0.8)] border border-[#333]"></div>
</div>
</div>
<!-- Physical Tonearm (Skeuomorphic) -->
<div class="absolute -right-32 top-1/4 w-[280px] h-12 origin-right rotate-[25deg] z-30 transition-transform duration-1000 ease-in-out">
<!-- Counterweight -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-16 h-14 bg-surface-variant rounded-l-full tonearm border border-white/10"></div>
<!-- Arm tube -->
<div class="absolute right-12 top-1/2 -translate-y-1/2 w-[220px] h-3 tonearm rounded-full shadow-lg"></div>
<!-- Headshell -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-12 h-8 bg-[#111] rounded shadow-xl border border-white/5 transform -rotate-12">
<!-- Stylus light indicator -->
<div class="absolute bottom-1 right-2 w-1 h-1 bg-aurora-cyan rounded-full shadow-[0_0_5px_#00f0ff]"></div>
</div>
</div>
</div>
<!-- Minimalist Track Info (Bottom Center) -->
<div class="absolute bottom-24 text-center z-20 flex flex-col items-center drop-shadow-[0_0_10px_rgba(0,240,255,0.3)]">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-wide mb-2 mix-blend-screen text-shadow-lg">MIDNIGHT SYNTHESIS</h1>
<p class="font-label-caps text-label-caps text-aurora-cyan/80 tracking-[0.3em]">AURORA NEON • EP 04</p>
</div>
<!-- Hidden UI Controls (Revealed on hover near bottom) -->
<div class="ui-reveal-area absolute bottom-0 left-0 w-full h-48 bg-gradient-to-t from-black via-black/80 to-transparent z-40 flex items-end justify-center pb-8 px-container-padding">
<div class="flex items-center gap-12 bg-surface/10 backdrop-blur-xl border-t border-white/10 px-12 py-4 rounded-full shadow-2xl">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]" data-icon="shuffle">shuffle</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[36px]" data-icon="skip_previous">skip_previous</span>
</button>
<!-- Play/Pause Button - Glassmorphism -->
<button class="w-16 h-16 rounded-full bg-white/5 border border-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white/10 hover:shadow-[0_0_20px_rgba(0,240,255,0.3)] transition-all transform hover:scale-105 group">
<span class="material-symbols-outlined text-[40px] text-primary group-hover:text-aurora-cyan transition-colors" data-icon="pause" data-weight="fill">pause</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[36px]" data-icon="skip_next">skip_next</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]" data-icon="repeat">repeat</span>
</button>
</div>
</div>
<!-- Top Navigation Anchor (Hidden/Minimalist) -->
<div class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding pt-8 no-border bg-transparent opacity-0 hover:opacity-100 transition-opacity duration-300">
<div class="font-display-lg text-display-lg-mobile tracking-tighter text-primary uppercase drop-shadow-md">VinylDeck</div>
<div class="flex gap-6">
<button class="text-primary hover:text-aurora-cyan transition-colors"><span class="material-symbols-outlined" data-icon="queue_music">queue_music</span></button>
<button class="text-primary hover:text-aurora-cyan transition-colors"><span class="material-symbols-outlined" data-icon="fullscreen_exit">fullscreen_exit</span></button>
</div>
</div>
<!-- JS for Particles -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particles-container');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 4 + 1; // 1px to 5px
                const xPos = Math.random() * 100; // 0 to 100vw
                const yPos = Math.random() * 100; // 0 to 100vh
                const opacity = Math.random() * 0.5 + 0.1;
                const animDuration = Math.random() * 20 + 10; // 10s to 30s
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${xPos}vw`;
                particle.style.top = `${yPos}vh`;
                particle.style.opacity = opacity;
                
                // Simple drifting animation
                particle.animate([
                    { transform: `translate(0, 0)` },
                    { transform: `translate(${Math.random() * 100 - 50}px, -${Math.random() * 200 + 100}px)` }
                ], {
                    duration: animDuration * 1000,
                    iterations: Infinity,
                    direction: 'alternate',
                    easing: 'ease-in-out'
                });

                container.appendChild(particle);
            }
        });
    </script>
</body></html>
