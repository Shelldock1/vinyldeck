<style>
        body {
            background-color: transparent;
            /* In a real widget, this would be transparent over the desktop. Using a dark background here for visibility. */
            background-color: #000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .vinyl-record {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            position: relative;
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.05),
                inset 0 0 10px rgba(0,0,0,0.8);
            animation: spin 10s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .vinyl-record:hover {
            transform: scale(1.02);
            box-shadow: 
                0 0 60px rgba(255, 255, 255, 0.1),
                inset 0 0 10px rgba(0,0,0,0.8);
        }

        .grooves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.02);
            pointer-events: none;
        }
        .groove-1 { width: 180px; height: 180px; }
        .groove-2 { width: 150px; height: 150px; border-color: rgba(255, 255, 255, 0.04); }
        .groove-3 { width: 120px; height: 120px; }
        .groove-4 { width: 90px; height: 90px; border-color: rgba(255, 255, 255, 0.03); }

        .label {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #474747; /* secondary-container */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .label-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            mix-blend-mode: luminosity;
        }

        .spindle-hole {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #000;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .progress-ring {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            /* Simulated progress */
            border-top-color: #ffffff;
            border-right-color: #ffffff;
            opacity: 0.3;
            transform: rotate(45deg);
            filter: blur(1px);
        }

        /* Hover Overlay */
        .widget-container {
            position: relative;
        }

        .hover-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Let clicks pass through if needed, or handle inside */
        }

        .widget-container:hover .hover-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        .hover-overlay .material-symbols-outlined {
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .hover-overlay .material-symbols-outlined:hover {
            transform: scale(1.1);
            color: #dde3eb; /* primary-container */
        }

        .track-info {
            position: absolute;
            bottom: -40px;
            width: 200px;
            text-align: center;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .widget-container:hover .track-info {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Volumetric pulse */
        .pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            animation: pulse-glow 4s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>
</head>
