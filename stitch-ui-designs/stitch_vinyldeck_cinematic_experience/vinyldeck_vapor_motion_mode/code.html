<style>
        /* Vaporwave Synthwave Custom Styling */
        body {
            background-color: #050014;
            overflow: hidden;
            cursor: default;
        }
        
        body.ui-hidden {
            cursor: none;
        }

        .vapor-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.15) 0%, rgba(5, 0, 20, 1) 70%);
            animation: breatheBg 6s ease-in-out infinite;
        }
        
        @keyframes breatheBg {
            0%, 100% { background: radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.15) 0%, rgba(5, 0, 20, 1) 70%); }
            50% { background: radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.25) 0%, rgba(5, 0, 20, 1) 70%); }
        }

        .grid-floor {
            position: fixed;
            bottom: -50vh;
            left: -50vw;
            width: 200vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            opacity: 0.4;
            animation: moveGrid 10s linear infinite;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: floatOrb 20s infinite alternate ease-in-out;
        }

        .orb-1 { width: 400px; height: 400px; background: #ff00ff; top: 10%; left: 20%; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: #00ffff; bottom: 20%; right: 10%; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #ff00ff; top: 40%; right: 25%; animation-delay: -10s; filter: blur(100px); }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { opacity: 0.7; }
            100% { transform: translate(100px, 100px) scale(1.3); opacity: 0.4; }
        }

        .vinyl-container {
            position: relative;
            width: min(80vw, 60vh);
            height: min(80vw, 60vh);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                #111 0%, 
                #000 2%, 
                #111 4%, 
                #222 5%
            );
            box-shadow: 
                calc((var(--mouse-x, 0.5) - 0.5) * 60px) calc((var(--mouse-y, 0.5) - 0.5) * 60px) 50px rgba(255, 0, 255, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 4s linear infinite;
            position: relative;
        }

        .vinyl-record::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.1) 45deg, transparent 90deg, transparent 180deg, rgba(255,255,255,0.1) 225deg, transparent 270deg);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .vinyl-label {
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid #ff00ff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }
        
        .vinyl-hole {
            width: 10%;
            height: 10%;
            background: #050014;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .progress-ring-container {
            position: absolute;
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;
            pointer-events: none;
        }

        .progress-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 255, 0.1);
            position: relative;
            animation: breathePulse 3s ease-in-out infinite;
        }
        
        @keyframes breathePulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 255, 0.2); }
            50% { box-shadow: 0 0 50px rgba(255, 0, 255, 0.6); }
        }

        .progress-ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #ff00ff;
            border-right-color: #ff00ff;
            transform: rotate(-45deg); /* Start at top */
            box-shadow: 0 0 10px #ff00ff, inset 0 0 10px #ff00ff;
        }

        /* Tonearm Styling */
        .tonearm-container {
            position: absolute;
            top: 5%;
            right: -15%;
            transform-origin: 20px 20px;
            transform: rotate(25deg);
            z-index: 10;
            pointer-events: none;
        }

        .tonearm-base {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #444, #111);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2);
            position: relative;
            z-index: 2;
        }

        .tonearm-arm {
            position: absolute;
            top: 25px;
            left: 20px;
            width: 12px;
            height: min(35vw, 25vh);
            background: linear-gradient(90deg, #222, #666, #111);
            border-radius: 6px;
            transform-origin: top center;
            overflow: hidden;
            box-shadow: 5px 10px 15px rgba(0,0,0,0.5);
        }

        .tonearm-arm::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 40%, rgba(255, 255, 255, 0.6) 50%, transparent 60%);
            background-size: 100% 200%;
            animation: armShimmer 3s infinite linear;
        }

        @keyframes armShimmer {
            0% { background-position: 0 -100%; }
            100% { background-position: 0 200%; }
        }

        .tonearm-head {
            position: absolute;
            bottom: -20px;
            left: -14px;
            width: 40px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 4px;
            transform: rotate(20deg);
            box-shadow: 2px 5px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.1);
        }

        /* Hover Reveal UI Elements */
        .ui-element {
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.ui-active .ui-element {
            opacity: 1;
        }

        .controls-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 40px 20px;
            background: linear-gradient(to top, rgba(5, 0, 20, 0.9) 0%, transparent 100%);
            transform: translateY(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        body.ui-active .controls-overlay {
            transform: translateY(0);
        }

        .top-app-bar {
            transform: translateY(-20px);
        }
        
        body.ui-active .top-app-bar {
            transform: translateY(0);
        }
        
        .track-info-container {
            transform: translateY(10px);
        }
        
        body.ui-active .track-info-container {
            transform: translateY(0);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 255, 0.2);
            border-radius: 50%;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.1);
        }

        .glass-btn:hover {
            background: rgba(255, 0, 255, 0.2);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            transform: scale(1.1);
        }
        
        .glass-btn.play-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
        }

        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }
    </style>
</head>

<script>
    // Reactive Lighting & Hover Reveal Logic
    const body = document.body;
    let uiTimeout;

    function showUI() {
        body.classList.add('ui-active');
        body.classList.remove('ui-hidden');
        clearTimeout(uiTimeout);
        uiTimeout = setTimeout(() => {
            body.classList.remove('ui-active');
            body.classList.add('ui-hidden');
        }, 2500); // Hide UI after 2.5 seconds of inactivity
    }

    document.addEventListener('mousemove', (e) => {
        // Reactive Light Direction
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        document.documentElement.style.setProperty('--mouse-x', x);
        document.documentElement.style.setProperty('--mouse-y', y);

        // UI Reveal
        showUI();
    });

    // Initial trigger to show UI momentarily on load
    showUI();
</script>
