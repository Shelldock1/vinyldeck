<style>
        body {
            background-color: #000000;
            overflow: hidden;
            cursor: default;
        }
        
        .vinyl-grooves {
            background: repeating-radial-gradient(
                #111 0,
                #111 2px,
                #1a1a1a 3px,
                #1a1a1a 4px
            );
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-anim {
            animation: spin 4s linear infinite;
        }

        .tonearm {
            transform-origin: top right;
            transform: rotate(20deg);
            transition: transform 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tonearm.active {
            transform: rotate(35deg);
        }

        @keyframes breathe {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
            50% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.8)); }
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.1s linear;
            animation: breathe 4s ease-in-out infinite;
        }
        
        .volumetric-glow {
            box-shadow: 0 0 100px 20px rgba(255, 255, 255, 0.05);
        }

        .ui-element {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        .ui-element.visible {
            opacity: 1;
            pointer-events: auto;
        }

        body.hide-cursor {
            cursor: none;
        }
    </style>
</head>
<body class="text-on-surface h-screen w-screen relative font-body-lg antialiased hide-cursor">
<!-- Atmospheric Particles Canvas -->
<canvas class="absolute inset-0 pointer-events-none z-0" id="particles" width="1280" height="600"></canvas>
<!-- Ambient Background Light -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.03)_0%,rgba(0,0,0,1)_70%)] z-0"></div>
<!-- Top App Bar -->
<header class="ui-element fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding pt-8 bg-transparent">
<h1 class="font-display-lg text-display-lg tracking-tighter text-primary uppercase">VinylDeck</h1>
<div class="flex gap-gutter">
<span class="material-symbols-outlined text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">palette</span>
<span class="material-symbols-outlined text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">queue_music</span>
<span class="material-symbols-outlined text-primary opacity-100 scale-95 duration-200 cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fullscreen</span>
<span class="material-symbols-outlined text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
</header>
<!-- Main Stage: Centerpiece Vinyl -->
<main class="h-full w-full flex flex-col items-center justify-center relative z-10">
<!-- Vinyl Container -->
<div class="relative w-[614px] h-[614px] max-w-[600px] max-h-[600px] flex items-center justify-center">
<!-- Progress Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="#333" stroke-width="0.5"></circle>
<circle class="progress-ring-circle" cx="50" cy="50" fill="none" r="48" stroke="#fff" stroke-dasharray="301.59" stroke-dashoffset="100" stroke-width="1.5" style="stroke-dashoffset: 278.971;"></circle>
</svg>
<!-- The Record -->
<div class="w-[90%] h-[90%] rounded-full bg-black relative shadow-[0_20px_50px_rgba(0,0,0,0.8)] border border-white/5 volumetric-glow spin-anim" id="vinyl-record">
<!-- Grooves -->
<div class="absolute inset-[2%] rounded-full vinyl-grooves opacity-80"></div>
<!-- Dynamic Shine Reflection -->
<div class="absolute inset-0 rounded-full mix-blend-screen pointer-events-none opacity-60 transition-all duration-100 ease-out" id="vinyl-shine" style="background: conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 15%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.08) 65%, rgba(255,255,255,0) 80%, rgba(255,255,255,0) 100%);"></div>
<!-- Center Label (Album Art) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[35%] h-[35%] rounded-full bg-surface-variant overflow-hidden border-2 border-black">
<img alt="Album Art" class="w-full h-full object-cover" data-alt="A moody, high-contrast photograph of a jazz band performing in a dimly lit, smoky club. The scene is illuminated by a single, dramatic spotlight cutting through the darkness, highlighting the gleaming brass of a saxophone. The overall aesthetic is dark, cinematic, and rich, perfectly matching a high-fidelity, luxury dark mode UI. The colors are muted with deep blacks, warm amber highlights, and a cinematic grain." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJCg-qRXIZeDfI-UZymL5yv-lIQDGlXHtuMOJeZI-3QQrEVsE7BpbTDh0Gt7zs8dppz_b19mOJvWZnFvrk2_Oz7N8w0uaBBHLbBRcFuCo7C0oeqbk4wFMr6tpZDWSyHJpK7v05y2sm9IpXLcrq-Kj4Z0SwOw84McVB0eowizqle1ljVjX7as6SCp1btO4M7iHQ0OEHKEnru2-GLZzWwf1tX-VsqHeJ9a0Vcl1Qn4Vtlwx_eoeZE2qIUDs3iHoUyhsVX1rLjMMhCnRq">
<!-- Spindle Hole -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-black shadow-inner"></div>
</div>
</div>
<!-- Tonearm -->
<div class="absolute top-0 right-0 w-[40%] h-[120%] pointer-events-none tonearm active z-10" id="tonearm">
<!-- Base Pivot -->
<div class="absolute top-[10%] right-[10%] w-12 h-12 rounded-full bg-gradient-to-br from-zinc-600 to-zinc-900 border border-zinc-500 shadow-2xl flex items-center justify-center">
<div class="w-6 h-6 rounded-full bg-gradient-to-br from-zinc-800 to-black"></div>
</div>
<!-- Arm -->

<div class="absolute bottom-[10%] right-[30%] w-6 h-10 bg-gradient-to-b from-zinc-800 to-black rounded-sm transform rotate-[35deg] shadow-xl border border-zinc-700"></div>
</div>
</div>
<!-- Track Info & Hidden Controls -->
<div class="ui-element absolute bottom-16 w-full flex flex-col items-center">
<!-- Playback Controls -->
<div class="flex items-center gap-8 mb-8 pointer-events-auto">
<button class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:text-primary hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">skip_previous</span>
</button>
<button class="w-16 h-16 rounded-full bg-[#E2E8F0] text-black flex items-center justify-center hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] transition-all transform hover:scale-105" id="play-pause-btn">
<span class="material-symbols-outlined text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:text-primary hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">skip_next</span>
</button>
</div>
<!-- Typography -->
<div class="text-center px-4">
<h2 class="font-headline-lg text-headline-lg text-primary mb-2 drop-shadow-lg">Midnight Voyage</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-80 tracking-wide uppercase font-label-caps text-label-caps">The Cinematic Orchestra</p>
</div>
</div>
</main>
<script>
        // Simple Interaction Logic
        const playBtn = document.getElementById('play-pause-btn');
        const vinyl = document.getElementById('vinyl-record');
        const tonearm = document.getElementById('tonearm');
        let isPlaying = true;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playBtn.querySelector('span');
            
            if (isPlaying) {
                icon.textContent = 'pause';
                vinyl.style.animationPlayState = 'running';
                tonearm.classList.add('active');
            } else {
                icon.textContent = 'play_arrow';
                vinyl.style.animationPlayState = 'paused';
                tonearm.classList.remove('active');
            }
        });

        // Simulate Progress
        const circle = document.querySelector('.progress-ring-circle');
        let progress = 0;
        setInterval(() => {
            if(isPlaying) {
                progress += 0.1;
                if(progress > 100) progress = 0;
                const offset = 301.59 - (progress / 100) * 301.59;
                circle.style.strokeDashoffset = offset;
            }
        }, 100);

        // UI Inactivity Fade
        let inactivityTimeout;
        const uiElements = document.querySelectorAll('.ui-element');
        
        function showUI() {
            document.body.classList.remove('hide-cursor');
            uiElements.forEach(el => el.classList.add('visible'));
            
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                uiElements.forEach(el => el.classList.remove('visible'));
                document.body.classList.add('hide-cursor');
            }, 3000);
        }

        document.addEventListener('mousemove', showUI);
        document.addEventListener('click', showUI);
        
        // Initial show
        showUI();

        // Dynamic Vinyl Reflection
        const shine = document.getElementById('vinyl-shine');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX - window.innerWidth / 2;
            const y = e.clientY - window.innerHeight / 2;
            let angle = Math.atan2(y, x) * (180 / Math.PI) + 90;
            shine.style.background = `conic-gradient(from ${angle}deg at 50% 50%, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 15%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.08) 65%, rgba(255,255,255,0) 80%, rgba(255,255,255,0) 100%)`;
        });

        // Atmospheric Particles System
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(200, 200, 200, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            const numberOfParticles = (canvas.width * canvas.height) / 15000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body></html>
