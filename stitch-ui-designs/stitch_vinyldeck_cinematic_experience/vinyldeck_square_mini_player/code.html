<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VinylDeck - Mini Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#c1c7cf",
                        "secondary-container": "#474747",
                        "primary-fixed": "#dde3eb",
                        "on-primary": "#2b3137",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-secondary-fixed": "#1b1b1b",
                        "outline": "#8e9195",
                        "inverse-on-surface": "#313031",
                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary-fixed-variant": "#51443a",
                        "surface-bright": "#393939",
                        "secondary-fixed": "#e2e2e2",
                        "primary-fixed-dim": "#c1c7cf",
                        "on-error": "#690005",
                        "surface-container": "#201f20",
                        "on-tertiary-container": "#706256",
                        "surface": "#131314",
                        "on-background": "#e5e2e2",
                        "surface-container-highest": "#353535",
                        "on-surface": "#e5e2e2",
                        "surface-container-low": "#1b1b1c",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "tertiary-container": "#f3dfd0",
                        "on-primary-fixed-variant": "#41474e",
                        "tertiary-fixed": "#f3dfd0",
                        "on-secondary-container": "#b5b5b5",
                        "on-surface-variant": "#c5c6cb",
                        "secondary": "#c6c6c6",
                        "primary": "#ffffff",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#e5e2e2",
                        "tertiary": "#ffffff",
                        "outline-variant": "#44474a",
                        "on-secondary": "#303030",
                        "on-primary-fixed": "#161c22",
                        "primary-container": "#dde3eb",
                        "inverse-primary": "#595f66",
                        "background": "#131314",
                        "on-tertiary-fixed": "#241a11",
                        "surface-container-high": "#2a2a2a",
                        "on-tertiary": "#3a2e24",
                        "tertiary-fixed-dim": "#d6c3b5",
                        "on-secondary-fixed-variant": "#474747",
                        "surface-variant": "#353535",
                        "surface-dim": "#131314",
                        "on-primary-container": "#5f656c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "48px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-padding": "32px"
                    },
                    "fontFamily": {
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg": ["Sora"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Sora"],
                        "body-md": ["Inter"],
                        "headline-md": ["Sora"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.2em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(19, 19, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.02"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow {
            box-shadow: 0 0 40px rgba(95, 101, 108, 0.3), inset 0 0 20px rgba(221, 227, 235, 0.05);
        }

        .deep-shadow {
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.6);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .vinyl-record {
            animation: spin 4s linear infinite;
        }

        .metallic-gradient {
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #64748b 100%);
        }
        
        .brushed-metal {
            background: linear-gradient(90deg, #333 0%, #444 20%, #222 40%, #555 60%, #333 80%, #222 100%);
            background-size: 200% 100%;
        }

        /* Material Symbols Fill override */
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface h-screen w-screen flex items-center justify-center font-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Mini Player Container -->
<div class="relative w-[320px] h-[320px] rounded-[24px] glass-panel ambient-glow deep-shadow flex flex-col items-center justify-between p-6 z-10 group transition-transform duration-300 hover:scale-[1.02]">
<!-- Ambient Art Background (Simulated glow from album art) -->
<div class="absolute inset-0 rounded-[24px] overflow-hidden -z-10 opacity-30 blur-2xl">
<div class="absolute inset-0 bg-gradient-to-br from-primary-container via-surface-container to-surface-container-lowest"></div>
</div>
<!-- Top Controls / Drag Area -->
<div class="w-full flex justify-between items-center z-20">
<button class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[20px]" data-icon="open_in_full">open_in_full</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Center: Vinyl Player -->
<div class="relative w-[180px] h-[180px] flex items-center justify-center mt-2 z-20">
<!-- Platter Base -->
<div class="absolute w-[170px] h-[170px] rounded-full bg-surface-container-low border border-surface-variant shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)]"></div>
<!-- Vinyl Record -->
<div class="relative w-[160px] h-[160px] rounded-full bg-[#0a0a0a] shadow-xl vinyl-record border border-[#1a1a1a] flex items-center justify-center">
<!-- Grooves -->
<div class="absolute inset-1 rounded-full border border-white/5"></div>
<div class="absolute inset-3 rounded-full border border-white/5"></div>
<div class="absolute inset-5 rounded-full border border-white/5"></div>
<div class="absolute inset-7 rounded-full border border-white/5"></div>
<div class="absolute inset-9 rounded-full border border-white/5"></div>
<!-- Center Label (Album Art representation) -->
<div class="w-[60px] h-[60px] rounded-full bg-primary-container flex items-center justify-center overflow-hidden border-2 border-[#0a0a0a] shadow-inner relative">
<div class="absolute inset-0 bg-gradient-to-tr from-surface-variant to-secondary-container"></div>
<img class="w-full h-full object-cover mix-blend-overlay opacity-80" data-alt="A macro shot of a sleek, abstract visual representation of a vinyl record label. The label features a minimalist geometric design in shades of deep charcoal, slate gray, and subtle metallic silver accents. The texture mimics premium matte paper with a slight sheen. The lighting is dramatic and directional, highlighting the circular grooves of the surrounding vinyl and casting a sharp, sophisticated shadow across the label's surface. The overall mood is luxurious, modern, and aligned with high-end audio equipment aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5hm2nk854jCm_89X0Wuv1YuLgIvDUBduSFbEpN0fcSMG0VsCchnD7t90hWQfA9_qkbDnTZi2HTKABjMxPyFEfDKnOSYoTmA8HvlPGlqnIG-5ysN3s-GLfXf05ICTNYHA4oXY151Ra3undpbVln0ffwGn_LwRrtsou6SuUusZuAa4NnG7vp7xyTsOqlaOzjjCCMmEfBzBz5V5k6dlIQokdiBMSTlYKfC-w99qYrROEbViQYK7ffEdbpXxDw7UFCAaL4NQyS8IXmEFF">
<!-- Spindle Hole -->
<div class="w-[6px] h-[6px] rounded-full bg-surface-container-lowest z-10 border border-white/10"></div>
</div>
</div>
<!-- Tonearm -->
<div class="absolute top-[10px] right-[5px] w-[20px] h-[100px] origin-top-right transform rotate-[25deg] transition-transform duration-700 ease-in-out">
<!-- Pivot Base -->
<div class="absolute top-0 right-0 w-[24px] h-[24px] rounded-full brushed-metal shadow-lg border border-white/20 z-30 flex items-center justify-center">
<div class="w-[12px] h-[12px] rounded-full bg-surface-container-lowest border border-white/10"></div>
</div>
<!-- Arm -->
<div class="absolute top-[12px] right-[10px] w-[4px] h-[80px] metallic-gradient rounded-full shadow-md z-20"></div>
<!-- Headshell -->
<div class="absolute bottom-[-10px] right-[4px] w-[14px] h-[24px] bg-[#222] rounded-sm shadow-md border-t border-white/10 z-20 transform rotate-[-15deg]">
<div class="absolute bottom-1 right-2 w-[2px] h-[4px] bg-red-500 rounded-full shadow-[0_0_4px_rgba(239,68,68,0.8)]"></div>
</div>
</div>
</div>
<!-- Bottom: Info & Controls -->
<div class="w-full flex flex-col items-center mt-4 z-20">
<!-- Track Info -->
<div class="text-center mb-4 w-full px-4">
<h3 class="font-headline-md text-headline-md text-primary truncate max-w-full tracking-tight">Midnight City</h3>
<p class="font-label-caps text-label-caps text-on-surface-variant truncate max-w-full mt-1">M83 • HARRY'S MIX</p>
</div>
<!-- Playback Controls -->
<div class="flex items-center justify-center gap-6">
<button class="w-[32px] h-[32px] flex items-center justify-center rounded-full border border-outline-variant text-on-surface hover:border-primary hover:text-primary hover:bg-surface-container-high transition-all focus:outline-none">
<span class="material-symbols-outlined text-[18px]" data-icon="skip_previous" data-weight="fill">skip_previous</span>
</button>
<!-- Primary Play/Pause Button -->
<button class="w-[48px] h-[48px] flex items-center justify-center rounded-full bg-[#E2E8F0] text-[#0f172a] shadow-[0_0_15px_rgba(226,232,240,0.3)] hover:shadow-[0_0_25px_rgba(226,232,240,0.6)] hover:scale-105 transition-all focus:outline-none group/play">
<span class="material-symbols-outlined text-[24px] group-hover/play:scale-95 transition-transform" data-icon="pause" data-weight="fill">pause</span>
</button>
<button class="w-[32px] h-[32px] flex items-center justify-center rounded-full border border-outline-variant text-on-surface hover:border-primary hover:text-primary hover:bg-surface-container-high transition-all focus:outline-none">
<span class="material-symbols-outlined text-[18px]" data-icon="skip_next" data-weight="fill">skip_next</span>
</button>
</div>
</div>
<!-- Subtle Progress Arc (Top edge of player) -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-surface-container-highest">
<div class="h-full bg-primary w-[35%] relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-[4px] h-[4px] bg-primary rounded-full shadow-[0_0_6px_rgba(255,255,255,0.8)]"></div>
</div>
</div>
</div>
</body></html>
