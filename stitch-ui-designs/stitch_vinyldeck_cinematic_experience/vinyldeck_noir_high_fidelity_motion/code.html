<style>
        .vinyl-grooves {
            background: repeating-radial-gradient(

        .vinyl-reflection {
            background: conic-gradient(

                rgba(255, 255, 255, 0.02) 0deg,
                transparent 45deg,
                transparent 135deg,
                rgba(255, 255, 255, 0.08) 180deg,
                transparent 225deg,
                transparent 315deg,
                rgba(255, 255, 255, 0.02) 360deg
            );
            transition: --rotation 0.1s ease-out;
        }
        .glass-panel {
            background: rgba(35, 35, 35, 0.15);
            backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .tonearm {
            transform-origin: top right;
            transform: rotate(25deg);
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .tonearm.playing {
            transform: rotate(40deg);
        }
        .procedural-grain {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        @property --rotation {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        .ambient-glow {
            transition: background-color 2s ease;
        }

</div>

<script>
    // Parallax Effect
    document.addEventListener('mousemove', (e) => {
        const layers = document.querySelectorAll('.parallax-layer');
        const x = (window.innerWidth - e.pageX * 2) / 100;
        const y = (window.innerHeight - e.pageY * 2) / 100;

        layers.forEach(layer => {
            const speed = layer.getAttribute('data-speed');
            const xOffset = x * speed * 100;
            const yOffset = y * speed * 100;
            layer.style.transform = `translate3d(${xOffset}px, ${yOffset}px, 0)`;
        });

        // Dynamic Vinyl Reflection
        const vinylShine = document.getElementById('vinyl-shine');
        if(vinylShine) {
            const rect = vinylShine.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const angle = Math.atan2(e.pageY - centerY, e.pageX - centerX) * (180 / Math.PI);
            vinylShine.style.setProperty('--rotation', `${angle + 90}deg`);
        }
    });

    // Tonearm Interaction
    const playBtn = document.getElementById('play-pause-btn');
    const playIcon = document.getElementById('play-icon');
    const tonearm = document.getElementById('tonearm');
    const vinylRecord = document.getElementById('vinyl-record');
    let isPlaying = true;

    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        
        if (isPlaying) {
            playIcon.textContent = 'pause';
            tonearm.classList.add('playing');
            vinylRecord.style.animationPlayState = 'running';
        } else {
            playIcon.textContent = 'play_arrow';
            tonearm.classList.remove('playing');
            vinylRecord.style.animationPlayState = 'paused';
        }
    });
</script>
