<style>
        /* Vaporwave Synthwave Custom Styling */
        body {
            background-color: #050014;
            overflow: hidden;
        }

        .vapor-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle at 50% 50%, rgba(255, 0, 255, 0.15) 0%, rgba(5, 0, 20, 1) 70%);
        }

        .grid-floor {
            position: fixed;
            bottom: -50vh;
            left: -50vw;
            width: 200vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            opacity: 0.4;
            animation: moveGrid 10s linear infinite;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-1 { width: 400px; height: 400px; background: #ff00ff; top: 10%; left: 20%; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: #00ffff; bottom: 20%; right: 10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.2); }
        }

        .vinyl-container {
            position: relative;
            width: min(80vw, 60vh);
            height: min(80vw, 60vh);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                #111 0%, 
                #000 2%, 
                #111 4%, 
                #222 5%
            );
            box-shadow: 
                0 0 50px rgba(255, 0, 255, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 4s linear infinite;
        }

        .vinyl-label {
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid #ff00ff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .vinyl-hole {
            width: 10%;
            height: 10%;
            background: #050014;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .progress-ring-container {
            position: absolute;
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;
            pointer-events: none;
        }

        .progress-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 255, 0.1);
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }

        .progress-ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #ff00ff;
            border-right-color: #ff00ff;
            transform: rotate(-45deg); /* Start at top */
            box-shadow: 0 0 10px #ff00ff, inset 0 0 10px #ff00ff;
        }

        /* Hover Reveal Controls */
        .controls-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 40px 20px;
            background: linear-gradient(to top, rgba(5, 0, 20, 0.9) 0%, transparent 100%);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        body:hover .controls-overlay {
            transform: translateY(0);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 255, 0.2);
            border-radius: 50%;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.1);
        }

        .glass-btn:hover {
            background: rgba(255, 0, 255, 0.2);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            transform: scale(1.1);
        }
        
        .glass-btn.play-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
        }

        .neon-text {
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }
        
        .top-app-bar {
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s ease;
        }
        
        body:hover .top-app-bar {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
