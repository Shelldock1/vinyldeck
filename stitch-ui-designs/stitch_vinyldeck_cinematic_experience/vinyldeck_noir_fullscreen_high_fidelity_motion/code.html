<style>
        body {
            background-color: #000000;
            overflow: hidden;
            perspective: 1000px;
        }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            opacity: 0.15;
        }

        .vinyl-grooves {
            background: repeating-radial-gradient(
                #111 0,
                #111 2px,
                #181818 3px,
                #181818 4px
            );
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
        }

        .vinyl-shine {
            background: conic-gradient(
                from 0deg at 50% 50%,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.08) 15%,
                rgba(255,255,255,0) 30%,
                rgba(255,255,255,0) 50%,
                rgba(255,255,255,0.08) 65%,
                rgba(255,255,255,0) 80%,
                rgba(255,255,255,0) 100%
            );
            transition: transform 0.1s linear;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-anim {
            animation: spin 4s linear infinite;
        }

        .tonearm {
            transform-origin: 10% 10%;
            transform: rotate(15deg);
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tonearm.active {
            transform: rotate(32deg);
        }

        .controls-hover-area {
            opacity: 0;
            filter: blur(10px);
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .controls-hover-area:hover, body.mouse-moved .controls-hover-area {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.1s linear;
        }
        
        .volumetric-glow {
            box-shadow: 
                0 0 120px 30px rgba(255, 255, 255, 0.03),
                inset 0 0 20px rgba(255,255,255,0.05),
                0 30px 60px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Particle System */
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: float 10s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }

        .stage-container {
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }
    </style>
</head>
<body class="text-on-surface h-screen w-screen relative font-body-lg antialiased">
<div class="noise-overlay"></div>
<div class="scanlines"></div>
<!-- Parallax Particle Container -->
<div class="fixed inset-0 pointer-events-none z-0" id="particles"></div>
<!-- Ambient Background Light -->
<div class="absolute inset-0 pointer-events-none bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.05)_0%,rgba(0,0,0,1)_80%)] z-0"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-white opacity-[0.02] blur-[100px] rounded-full pointer-events-none z-0"></div>
<!-- Top App Bar (Hidden by default in cinematic mode, minimal presence) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding pt-8 bg-transparent transition-all duration-700 ease-spring opacity-0 hover:opacity-100 -translate-y-4 hover:translate-y-0">

<div class="flex gap-gutter">

<span class="material-symbols-outlined text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all duration-300 ease-spring cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">queue_music</span>
<span class="material-symbols-outlined text-primary opacity-100 scale-95 duration-300 ease-spring cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fullscreen</span>
<span class="material-symbols-outlined text-primary opacity-60 hover:opacity-100 hover:scale-110 transition-all duration-300 ease-spring cursor-pointer" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
</header>
<!-- Main Stage: Centerpiece Vinyl -->
<main class="h-full w-full flex flex-col items-center justify-center relative z-10" id="main-stage">
<!-- Vinyl Container -->
<div class="stage-container relative w-[614px] h-[614px] max-w-[600px] max-h-[600px] flex items-center justify-center" id="vinyl-container">
<!-- Progress Ring -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]" viewBox="0 0 100 100">

<circle class="progress-ring-circle" cx="50" cy="50" fill="none" r="48" stroke="#fff" stroke-dasharray="301.59" stroke-dashoffset="100" stroke-linecap="round" stroke-width="1.5" style="stroke-dashoffset: 277.614;"></circle>
</svg>
<!-- The Record -->
<div class="w-[90%] h-[90%] rounded-full bg-[#0a0a0a] relative volumetric-glow spin-anim" id="vinyl-record">
<!-- Grooves -->

<!-- Shine Reflection -->

<!-- Center Label (Album Art) -->

<img alt="Album Art" class="w-full h-full object-cover opacity-90 mix-blend-luminosity" data-alt="A moody, high-contrast photograph of a jazz band performing in a dimly lit, smoky club. The scene is illuminated by a single, dramatic spotlight cutting through the darkness, highlighting the gleaming brass of a saxophone. The overall aesthetic is dark, cinematic, and rich, perfectly matching a high-fidelity, luxury dark mode UI. The colors are muted with deep blacks, warm amber highlights, and a cinematic grain." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJCg-qRXIZeDfI-UZymL5yv-lIQDGlXHtuMOJeZI-3QQrEVsE7BpbTDh0Gt7zs8dppz_b19mOJvWZnFvrk2_Oz7N8w0uaBBHLbBRcFuCo7C0oeqbk4wFMr6tpZDWSyHJpK7v05y2sm9IpXLcrq-Kj4Z0SwOw84McVB0eowizqle1ljVjX7as6SCp1btO4M7iHQ0OEHKEnru2-GLZzWwf1tX-VsqHeJ9a0Vcl1Qn4Vtlwx_eoeZE2qIUDs3iHoUyhsVX1rLjMMhCnRq">
<!-- Spindle Hole -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-gradient-to-br from-zinc-800 to-black shadow-inner border border-zinc-700/50"></div>

<div class="flex items-center gap-10 mb-8">
<button class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface/60 hover:text-primary hover:bg-white/5 transition-all duration-300 ease-spring hover:scale-110">
<span class="material-symbols-outlined text-2xl">skip_previous</span>
</button>
<button class="w-20 h-20 rounded-full bg-gradient-to-br from-white to-zinc-300 text-black flex items-center justify-center hover:shadow-[0_0_30px_rgba(255,255,255,0.4)] transition-all duration-500 ease-spring-bounce transform hover:scale-105" id="play-pause-btn">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface/60 hover:text-primary hover:bg-white/5 transition-all duration-300 ease-spring hover:scale-110">

</button>

</main>
<script>
        // Playback Logic
        const playBtn = document.getElementById('play-pause-btn');
        const vinyl = document.getElementById('vinyl-record');
        const tonearm = document.getElementById('tonearm');
        let isPlaying = true;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playBtn.querySelector('span');
            
            if (isPlaying) {
                icon.textContent = 'pause';
                vinyl.style.animationPlayState = 'running';
                tonearm.classList.add('active');
            } else {
                icon.textContent = 'play_arrow';
                vinyl.style.animationPlayState = 'paused';
                tonearm.classList.remove('active');
            }
        });

        // Progress Ring Simulation
        const circle = document.querySelector('.progress-ring-circle');
        let progress = 0;
        setInterval(() => {
            if(isPlaying) {
                progress += 0.05;
                if(progress > 100) progress = 0;
                const offset = 301.59 - (progress / 100) * 301.59;
                circle.style.strokeDashoffset = offset;
            }
        }, 50);

        // Parallax & Dynamic Lighting Effect
        const stageContainer = document.getElementById('vinyl-container');
        const vinylShine = document.getElementById('vinyl-shine');
        let mouseTimer;

        document.addEventListener('mousemove', (e) => {
            // Reveal controls
            document.body.classList.add('mouse-moved');
            clearTimeout(mouseTimer);
            mouseTimer = setTimeout(() => {
                document.body.classList.remove('mouse-moved');
            }, 3000);

            // Parallax tilt
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            
            requestAnimationFrame(() => {
                stageContainer.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
                // Shift the shine gradient based on mouse position to simulate physical light
                vinylShine.style.transform = `rotate(${x * 20}deg)`;
            });
        });

        // Particle System Generation
        const particleContainer = document.getElementById('particles');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            createParticle();
        }

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random properties
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 10;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.top = `${top}%`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;

            particleContainer.appendChild(particle);
        }
    </script>
