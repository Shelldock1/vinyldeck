<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VinylDeck - Cinematic Playback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Sora:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {

          theme: {
            extend: {

                      "surface-variant": "#353535",
                      "on-error-container": "#ffdad6",
                      "on-error": "#690005",
                      "inverse-surface": "#e5e2e2",
                      "on-background": "#e5e2e2",
                      "on-primary-fixed": "#161c22",

                      "primary-fixed-dim": "#c1c7cf",
                      "outline-variant": "#44474a",

                      "on-secondary-fixed-variant": "#474747",
                      "on-primary": "#2b3137",
                      "surface-container-low": "#1b1b1c",
                      "surface-dim": "#131314",
                      "on-primary-container": "#5f656c",
                      "surface-bright": "#393939",
                      "tertiary-container": "#f3dfd0",
                      "inverse-primary": "#595f66",
                      "on-tertiary-fixed-variant": "#51443a",
                      "surface-container-highest": "#353535",
                      "tertiary-fixed-dim": "#d6c3b5",
                      "on-secondary": "#303030",
                      "on-surface": "#e5e2e2",
                      "on-tertiary-container": "#706256",
                      "on-primary-fixed-variant": "#41474e",
                      "surface-container-high": "#2a2a2a",
                      "primary": "#ffffff",
                      "on-tertiary": "#3a2e24",
                      "tertiary": "#ffffff",
                      "error-container": "#93000a",
                      "error": "#ffb4ab",
                      "surface": "#131314",
                      "on-surface-variant": "#c5c6cb",
                      "surface-container-lowest": "#0e0e0f",
                      "inverse-on-surface": "#313031",
                      "secondary-container": "#474747",
                      "secondary": "#c6c6c6",
                      "secondary-fixed": "#e2e2e2",
                      "outline": "#8e9195",
                      "background": "#131314",
                      "surface-container": "#201f20",
                      "primary-container": "#dde3eb",
                      "on-secondary-fixed": "#1b1b1b",
                      "on-secondary-container": "#b5b5b5",
                      "on-tertiary-fixed": "#241a11",
                      "surface-tint": "#c1c7cf",
                      "tertiary-fixed": "#f3dfd0",
                      
                      // Warm Analog additions
                      "warm-bronze": "#c28b5e",
                      "warm-cream": "#f4ebd8",
                      "vinyl-black": "#0c0b0a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "touch-target": "48px",
                      "unit": "8px",
                      "gutter": "24px",
                      "container-padding": "32px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Inter"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "headline-lg": [
                              "Sora"
                      ],
                      "headline-md": [
                              "Sora"
                      ],
                      "display-lg": [
                              "Sora"
                      ],
                      "body-md": [
                              "Inter"
                      ]
              },
              backgroundImage: {
                  'vinyl-grooves': 'radial-gradient(circle, transparent 20%, rgba(255,255,255,0.03) 21%, transparent 22%, transparent 30%, rgba(255,255,255,0.03) 31%, transparent 32%, transparent 40%, rgba(255,255,255,0.03) 41%, transparent 42%, transparent 50%, rgba(255,255,255,0.03) 51%, transparent 52%, transparent 60%, rgba(255,255,255,0.03) 61%, transparent 62%, transparent 70%, rgba(255,255,255,0.03) 71%, transparent 72%, transparent 80%, rgba(255,255,255,0.03) 81%, transparent 82%)',
                  'bronze-metal': 'linear-gradient(135deg, #a67b5b 0%, #c28b5e 25%, #e0ac83 50%, #c28b5e 75%, #a67b5b 100%)'
              }
            },
          },
        }

<style>
        .spin-slow {
            animation: spin 3.3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 1. Analog Wobble Micro-animation */
        .wobble {
            animation: wobble 1.5s ease-in-out infinite alternate;
        }
        @keyframes wobble {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(1px, -1px) scale(1.002); }
            100% { transform: translate(-1px, 1px) scale(0.998); }
        }

        /* 2. Film Grain Texture */
        .film-grain {
            position: absolute;
            inset: -150%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.06%22/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: overlay;
            animation: grainStep 0.5s steps(4) infinite;
        }
        @keyframes grainStep {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1%, 2%); }
            50% { transform: translate(2%, -1%); }
            75% { transform: translate(-2%, -2%); }
            100% { transform: translate(1%, 1%); }
        }

        /* 2. Warm Floating Particles */
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(194,139,94,0.6) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 15s linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.4; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }

        /* 3. Golden Hour Lighting Pan */
        .golden-hour-light {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 0% 50%, rgba(194, 139, 94, 0.15), transparent 60%);
            pointer-events: none;
            z-index: 5;
            animation: panLight 20s ease-in-out infinite alternate;
        }
        @keyframes panLight {
            0% { background: radial-gradient(circle at 10% 30%, rgba(194, 139, 94, 0.15), transparent 60%); }
            100% { background: radial-gradient(circle at 90% 70%, rgba(194, 139, 94, 0.15), transparent 60%); }
        }

        /* 5. Tonearm Bounce Inertia */
        .tonearm-bounce {
            animation: tonearmDrop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: top right;
        }
        @keyframes tonearmDrop {
            0% { transform: rotate(10deg); }
            100% { transform: rotate(25deg); }
        }

        /* 6. Breathing Bronze Glow */
        .breathe-glow {
            animation: breathe 4s ease-in-out infinite alternate;
        }
        @keyframes breathe {
            0% { box-shadow: 0 0 30px rgba(194, 139, 94, 0.3), inset 0 0 15px rgba(194, 139, 94, 0.1); opacity: 0.6; }
            100% { box-shadow: 0 0 60px rgba(194, 139, 94, 0.6), inset 0 0 25px rgba(194, 139, 94, 0.3); opacity: 0.9; }
        }
        
        .breathe-shadow {
            animation: breatheShadow 4s ease-in-out infinite alternate;
        }
        @keyframes breatheShadow {
            0% { box-shadow: 0 0 5px rgba(194, 139, 94, 0.5); }
            100% { box-shadow: 0 0 15px rgba(194, 139, 94, 1); }
        }

        .ambient-bg {
            background: radial-gradient(circle at 50% 50%, #2a1f18 0%, #000000 80%);
        }
        .glass-panel {
            background: rgba(20, 15, 10, 0.6);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-body-lg ambient-bg relative">
<!-- Film Grain Overlay -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-50 mix-blend-overlay opacity-30">
<div class="film-grain"></div>
</div>
<!-- Golden Hour Light Panning -->
<div class="golden-hour-light"></div>
<!-- Floating Warm Particles -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-10">
<div class="particle w-8 h-8 left-[15%] animation-delay-0"></div>
<div class="particle w-12 h-12 left-[45%] animation-delay-[3s]"></div>
<div class="particle w-6 h-6 left-[75%] animation-delay-[7s]"></div>
<div class="particle w-10 h-10 left-[85%] animation-delay-[11s]"></div>
<div class="particle w-16 h-16 left-[25%] animation-delay-[14s]"></div>
</div>
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding pt-8 no-border bg-transparent flat no shadows transition-opacity duration-700 hover:opacity-100 opacity-60">
<div class="font-display-lg text-display-lg tracking-tighter text-warm-cream uppercase opacity-80">VinylDeck</div>
<div class="flex items-center gap-gutter">
<button class="text-warm-cream opacity-60 hover:opacity-100 hover:scale-110 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">palette</span>
</button>
<button class="text-warm-cream opacity-60 hover:opacity-100 hover:scale-110 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">queue_music</span>
</button>
<button class="text-warm-bronze opacity-100 drop-shadow-[0_0_8px_rgba(194,139,94,0.6)] hover:scale-110 transition-all duration-200 breathe-shadow">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fullscreen</span>
</button>
<button class="text-warm-cream opacity-60 hover:opacity-100 hover:scale-110 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center relative z-20 w-full h-full pb-32">
<!-- Center Stage: The Vinyl -->
<div class="relative w-[614px] h-[614px] max-w-[600px] max-h-[600px] flex items-center justify-center">
<!-- Glow Ring (Breathing) -->
<div class="absolute inset-[-10%] rounded-full breathe-glow pointer-events-none"></div>
<!-- Vinyl Wobble Container -->
<div class="w-full h-full wobble relative">
<!-- Vinyl Record (Spinning) -->
<div class="w-full h-full rounded-full bg-vinyl-black shadow-2xl relative flex items-center justify-center spin-slow" style="box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 4px #1a1a1a;">
<!-- Grooves -->
<div class="absolute inset-2 rounded-full bg-vinyl-grooves pointer-events-none mix-blend-screen opacity-50"></div>
<!-- Reflections -->
<div class="absolute inset-0 rounded-full pointer-events-none" style="background: conic-gradient(from 45deg, transparent 0deg, rgba(255,255,255,0.05) 45deg, transparent 90deg, transparent 180deg, rgba(255,255,255,0.05) 225deg, transparent 270deg);"></div>
<!-- Custom Center Label -->
<div class="w-[35%] h-[35%] rounded-full bg-warm-cream flex flex-col items-center justify-center relative overflow-hidden z-10 border border-black/20 breathe-glow" style="box-shadow: inset 0 0 20px rgba(0,0,0,0.2);">
<!-- Spindle Hole -->
<div class="absolute w-4 h-4 bg-vinyl-black rounded-full z-20 shadow-inner"></div>
<!-- Label Art/Text -->
<div class="absolute inset-0 flex flex-col items-center justify-around py-4 text-vinyl-black font-body-md opacity-80 pointer-events-none" style="background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.03) 10px, rgba(0,0,0,0.03) 20px);">
<span class="font-label-caps text-[10px] tracking-widest uppercase">Stereo</span>
<div class="text-center">
<h2 class="font-headline-md text-sm font-bold text-warm-bronze">Midnight Rambler</h2>
<p class="text-[10px] uppercase tracking-wider mt-1">The Rolling Stones</p>
</div>
<span class="font-label-caps text-[10px] tracking-widest uppercase">33 ⅓ RPM</span>
</div>
</div>
</div>
</div>
<!-- Tonearm (Bouncing Inertia) -->
<div class="absolute top-[10%] -right-[15%] w-16 h-[80%] z-30 pointer-events-none tonearm-bounce">
<!-- Pivot -->
<div class="absolute top-0 right-0 w-24 h-24 bg-surface-variant rounded-full shadow-2xl border-2 border-outline-variant flex items-center justify-center bg-bronze-metal">
<div class="w-16 h-16 bg-surface-dim rounded-full shadow-inner border border-surface-variant flex items-center justify-center">
<div class="w-4 h-4 bg-warm-bronze rounded-full shadow-lg"></div>
</div>
</div>
<!-- Arm -->
<div class="absolute top-12 right-[42px] w-2 h-full bg-bronze-metal rounded-full shadow-lg"></div>
<!-- Headshell -->
<div class="absolute bottom-0 right-[38px] w-8 h-16 bg-surface-variant rounded-sm shadow-xl border-t border-outline-variant transform rotate-12">
<div class="absolute -left-1 top-2 w-2 h-4 bg-warm-bronze"></div>
</div>
</div>
</div>
<!-- Track Info & Controls Area (Tactile UI Hover Fade) -->
<div class="absolute bottom-32 left-0 w-full px-container-padding flex flex-col items-center gap-8 opacity-40 hover:opacity-100 transition-opacity duration-1000 ease-in-out group z-40">
<!-- Metadata -->
<div class="text-center space-y-2 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-700 ease-out">
<h1 class="font-headline-lg text-headline-lg text-warm-cream drop-shadow-md">Midnight Rambler</h1>
<p class="font-body-lg text-body-lg text-warm-bronze opacity-80">Let It Bleed • 1969</p>
</div>
<!-- Playback Progress Ring / Light Path -->
<div class="w-full max-w-2xl flex items-center gap-4 px-8 transform translate-y-2 group-hover:translate-y-0 transition-transform duration-700 delay-75 ease-out">
<span class="font-label-caps text-label-caps text-warm-cream opacity-50">02:45</span>
<div class="flex-1 h-[2px] bg-white/10 relative rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full w-[45%] bg-warm-bronze breathe-shadow"></div>
</div>
<span class="font-label-caps text-label-caps text-warm-cream opacity-50">-04:12</span>
</div>
<!-- Controls -->
<div class="flex items-center gap-8 transform translate-y-4 group-hover:translate-y-0 transition-transform duration-700 delay-150 ease-out">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-warm-cream opacity-60 hover:opacity-100 hover:text-warm-bronze transition-all hover:shadow-[0_0_15px_rgba(194,139,94,0.3)]">
<span class="material-symbols-outlined text-[24px]">shuffle</span>
</button>
<button class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-warm-cream hover:text-warm-bronze transition-all hover:scale-105">
<span class="material-symbols-outlined text-[32px] font-light">skip_previous</span>
</button>
<!-- Play/Pause Button -->
<button class="w-24 h-24 rounded-full bg-warm-bronze flex items-center justify-center text-vinyl-black shadow-[0_0_30px_rgba(194,139,94,0.4)] hover:shadow-[0_0_50px_rgba(194,139,94,0.6)] hover:scale-105 transition-all relative overflow-hidden breathe-shadow">
<div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.06%22/%3E%3C/svg%3E')"></div>
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-warm-cream hover:text-warm-bronze transition-all hover:scale-105">
<span class="material-symbols-outlined text-[32px] font-light">skip_next</span>
</button>
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-warm-cream opacity-60 hover:opacity-100 hover:text-warm-bronze transition-all hover:shadow-[0_0_15px_rgba(194,139,94,0.3)]">
<span class="material-symbols-outlined text-[24px]">repeat</span>
</button>
</div>
</div>
</main>
</body></html>
