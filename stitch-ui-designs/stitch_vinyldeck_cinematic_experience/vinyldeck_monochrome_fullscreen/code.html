<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>VinylDeck - Cinematic Playback</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353535",
                        "on-error-container": "#ffdad6",
                        "on-error": "#690005",
                        "inverse-surface": "#e5e2e2",
                        "on-background": "#e5e2e2",
                        "on-primary-fixed": "#161c22",
                        "primary-fixed": "#dde3eb",
                        "primary-fixed-dim": "#c1c7cf",
                        "outline-variant": "#44474a",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-secondary-fixed-variant": "#474747",
                        "on-primary": "#2b3137",
                        "surface-container-low": "#1b1b1c",
                        "surface-dim": "#131314",
                        "on-primary-container": "#5f656c",
                        "surface-bright": "#393939",
                        "tertiary-container": "#f3dfd0",
                        "inverse-primary": "#595f66",
                        "on-tertiary-fixed-variant": "#51443a",
                        "surface-container-highest": "#353535",
                        "tertiary-fixed-dim": "#d6c3b5",
                        "on-secondary": "#303030",
                        "on-surface": "#e5e2e2",
                        "on-tertiary-container": "#706256",
                        "on-primary-fixed-variant": "#41474e",
                        "surface-container-high": "#2a2a2a",
                        "primary": "#ffffff",
                        "on-tertiary": "#3a2e24",
                        "tertiary": "#ffffff",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "surface": "#131314",
                        "on-surface-variant": "#c5c6cb",
                        "surface-container-lowest": "#0e0e0f",
                        "inverse-on-surface": "#313031",
                        "secondary-container": "#474747",
                        "secondary": "#c6c6c6",
                        "secondary-fixed": "#e2e2e2",
                        "outline": "#8e9195",
                        "background": "#131314",
                        "surface-container": "#201f20",
                        "primary-container": "#dde3eb",
                        "on-secondary-fixed": "#1b1b1b",
                        "on-secondary-container": "#b5b5b5",
                        "on-tertiary-fixed": "#241a11",
                        "surface-tint": "#c1c7cf",
                        "tertiary-fixed": "#f3dfd0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "48px",
                        "unit": "8px",
                        "gutter": "24px",
                        "container-padding": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg": ["Sora"],
                        "headline-md": ["Sora"],
                        "display-lg": ["Sora"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.2em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}]
                    },
                    "animation": {
                        'spin-slow': 'spin 8s linear infinite',
                        'pulse-glow': 'pulse-glow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    "keyframes": {
                        'pulse-glow': {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 10px rgba(255,255,255,0.2))' },
                            '50%': { opacity: 0.8, filter: 'drop-shadow(0 0 30px rgba(255,255,255,0.4))' },
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }
        
        /* Skeuomorphic touches */
        .vinyl-grooves {
            background: 
                repeating-radial-gradient(
                    #111 0, 
                    #111 2px, 
                    #0a0a0a 3px, 
                    #0a0a0a 4px
                );
        }
        
        .progress-ring circle {
            transition: stroke-dashoffset 0.1s linear;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">
<!-- Top App Bar (Hidden Nav, minimal presence) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding pt-8 bg-transparent no-border flat no shadows">
<div class="font-display-lg text-display-lg tracking-tighter text-primary uppercase opacity-20 hover:opacity-100 transition-opacity duration-500">
            VinylDeck
        </div>
<div class="flex gap-4 opacity-20 hover:opacity-100 transition-opacity duration-500">
<button class="text-primary hover:scale-110 transition-transform"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">palette</span></button>
<button class="text-primary hover:scale-110 transition-transform"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">queue_music</span></button>
<button class="text-primary hover:scale-110 transition-transform"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">fullscreen_exit</span></button>
<button class="text-primary hover:scale-110 transition-transform"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span></button>
</div>
</header>
<!-- Main Cinematic Canvas -->
<main class="w-full h-full flex flex-col items-center justify-center relative z-10">
<!-- Centerpiece: Vinyl Record -->
<div class="relative w-[614px] h-[614px] max-w-[600px] max-h-[600px] rounded-full flex items-center justify-center animate-pulse-glow group">
<!-- The Vinyl -->
<div class="absolute inset-0 rounded-full bg-black shadow-[0_0_50px_rgba(255,255,255,0.05)] border border-white/10 vinyl-grooves animate-spin-slow">
<!-- Inner Label -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[30%] h-[30%] rounded-full bg-surface-variant flex items-center justify-center border-4 border-black">
<img alt="Album Art" class="w-full h-full object-cover rounded-full opacity-80 mix-blend-luminosity" data-alt="Abstract high-contrast monochrome texture, reminiscent of soundwaves or minimalist graphic design. The aesthetic is stark black and white, fitting a premium dark luxury interface. Sharp lines and deep shadows emphasize OLED blacks." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBt3QY9-ESgwayijMEzTTwEJyY-zKwuIpNNZ1wqLABRM3bbQuw_k45HdLuTI513rp-zn00tfHqPQsD0C2ozi3E4n5AZ-Cu_3tOgg7xkyH_BL5IGVAjVbglKLkNEOVIgqt_OqJ76FYEqVr64xyQUejcuzousRpQOX5rLcOUK0mbzA535daam3rzNsP_WROOCUAvDKAgNh6IDYBCgh1pkCSPlR39HpNT2KLM-JNqZZVszPTMUvjSU866BFmbSYrKQBocwirEs7Pi_UAJD">
<!-- Spindle Hole -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-black shadow-inner"></div>
</div>
</div>
<!-- Progress Ring overlay -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none progress-ring" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="49" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"></circle>
<circle class="drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]" cx="50" cy="50" fill="none" r="49" stroke="#ffffff" stroke-dasharray="307.87" stroke-dashoffset="150" stroke-width="1.5"></circle>
</svg>
<!-- Tonearm (Skeuomorphic accent) -->
<div class="absolute -right-20 top-10 w-40 h-[70%] pointer-events-none origin-top-right transform rotate-[15deg] transition-transform duration-1000 ease-in-out opacity-40 group-hover:opacity-100">
<div class="w-3 h-full bg-gradient-to-r from-gray-500 via-gray-300 to-gray-600 rounded-full shadow-2xl relative">
<div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-8 h-12 bg-gray-800 rounded-sm border border-gray-600"></div>
<div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-12 h-12 rounded-full bg-gray-900 border-2 border-gray-500"></div>
</div>
</div>
</div>
<!-- Track Info (Minimal) -->
<div class="mt-20 text-center flex flex-col items-center space-y-4 opacity-60 hover:opacity-100 transition-opacity duration-300">
<h1 class="font-headline-md text-headline-md text-primary tracking-widest uppercase">Silent Echoes</h1>
<h2 class="font-label-caps text-label-caps text-on-surface-variant">MONOCHROME SYNTHESIS</h2>
<div class="font-label-caps text-label-caps text-on-surface-variant mt-2">02:14 / 05:30</div>
</div>
<!-- Hidden Playback Controls (Revealed on hover of bottom area) -->
<div class="absolute bottom-32 left-1/2 transform -translate-x-1/2 flex items-center gap-12 opacity-0 hover:opacity-100 transition-opacity duration-500 pb-10 pt-20 px-20">
<button class="text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-4xl">skip_previous</span></button>
<button class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center text-primary hover:bg-white hover:text-black transition-all duration-300 backdrop-blur-md border border-white/20">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined text-4xl">skip_next</span></button>
</div>
</main>
<!-- Bottom Nav Bar (Suppressed due to fullscreen intent, only showing subtle indicators if needed, but per prompt, zero clutter) -->
<!-- Navigation Shell suppressed for transactional/cinematic focus -->
</body></html>
