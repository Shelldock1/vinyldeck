<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">

<title>VinylDeck - Mini Player</title>

                      "outline": "#8e9195",
                      "inverse-on-surface": "#313031",
                      "surface-container-lowest": "#0e0e0f",

              "borderRadius": {

                      "full": "9999px"
              },
              "spacing": {
                      "touch-target": "48px",
                      "gutter": "24px",
                      "unit": "8px",
                      "container-padding": "32px"

<style>
        body {
            background-color: #000000;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .volumetric-spotlight {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 120%;
            background: radial-gradient(ellipse at top, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .vinyl-record {
            background: repeating-radial-gradient(
                #111 0,
                #111 2px,
                #1a1a1a 3px,
                #1a1a1a 4px
            );
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.05);
            animation: spin 4s linear infinite;
        }

        .groove-reflection {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                rgba(255,255,255,0) 0deg,
                rgba(255,255,255,0.1) 45deg,
                rgba(255,255,255,0) 90deg,
                rgba(255,255,255,0.1) 225deg,
                rgba(255,255,255,0) 270deg
            );
            pointer-events: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .brushed-metal {
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #2a2a2a 100%);
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.1), inset -1px -1px 0 rgba(0,0,0,0.5);
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.05);
        }

        .power-indicator {
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }
        
        .light-path {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="text-on-background">
<div class="volumetric-spotlight"></div>
<main class="relative z-10 glass-panel rounded-xl p-8 w-full max-w-[400px] flex flex-col items-center gap-8 shadow-2xl mx-4">
<!-- Header -->
<header class="w-full flex justify-between items-center">
<span class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors cursor-pointer" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.2em] uppercase">Now Playing</span>
<span class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors cursor-pointer" data-icon="more_vert">more_vert</span>
</header>
<!-- Record Stage -->
<div class="relative w-64 h-64 flex justify-center items-center">
<!-- Vinyl -->
<div class="vinyl-record w-full h-full rounded-full relative flex justify-center items-center">
<div class="groove-reflection"></div>
<!-- Label -->
<div class="w-24 h-24 rounded-full bg-surface-container-highest border border-outline-variant relative flex justify-center items-center overflow-hidden">
<img alt="Abstract dark moody texture" class="absolute w-full h-full object-cover opacity-60 mix-blend-overlay" data-alt="Close up of a dark, moody abstract texture. Deep cinematic blacks and stark white accents. The texture feels like rough matte paper or stone. The lighting is dramatic, coming from a steep angle to highlight the subtle ridges and valleys of the surface. Designed for a high-end OLED display dark luxury aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCt3JcO_YKLFkrTDj10WyIcmCKrndhZp79LdCJEXavVrZvTLuJKvP2DjtGUyJnksfg-lQVhEiCYIxP9S4GZNqDULAMU1eV1LIawNsAxuQjw5_l2vZvP84L6kq7GVQ_iOfq6WqEM9TCrNkLWkS3jOT-S138j7JoBxnU1iHucjD1EZehnju6S3TwLd3kkVxssXJDKKwaDD2-uqVdTe5EeV3nH_VwCkvFMHJbupDo-XGL1man9RmHhdDohN_P2Z7o7JzXfEzHsTvGZrc7p">
<div class="w-3 h-3 rounded-full bg-black z-10 shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]"></div>
</div>
</div>
<!-- Tonearm -->
<div class="absolute -right-8 top-4 origin-top-left transform rotate-12 transition-transform duration-1000">
<div class="w-8 h-8 rounded-full brushed-metal relative flex justify-center items-center z-20">
<div class="w-2 h-2 rounded-full bg-black"></div>
<div class="absolute top-1 right-1 w-1 h-1 rounded-full bg-red-500 power-indicator"></div>
</div>
<div class="w-2 h-40 brushed-metal absolute top-4 left-3 rounded-full"></div>
<div class="w-6 h-10 brushed-metal absolute top-40 left-1 rounded-md transform -rotate-12 border border-white/10"></div>
</div>
</div>
<!-- Track Info -->
<div class="text-center space-y-2">
<h1 class="font-headline-md text-headline-md text-primary tracking-wide">Midnight City</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Noir Synthwave Ensemble</p>
</div>
<!-- Playback Controls -->
<div class="w-full space-y-6">
<!-- Light Path Slider -->
<div class="flex items-center gap-4">
<span class="font-label-caps text-[10px] text-outline-variant">02:14</span>
<div class="flex-1 h-[2px] bg-surface-container-highest relative rounded-full">
<div class="absolute left-0 top-0 h-full w-1/3 bg-primary light-path rounded-full"></div>
<div class="absolute left-1/3 top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-primary shadow-[0_0_8px_rgba(255,255,255,0.8)] cursor-pointer hover:scale-125 transition-transform"></div>
</div>
<span class="font-label-caps text-[10px] text-outline-variant">05:40</span>
</div>
<!-- Transport Buttons -->
<div class="flex justify-center items-center gap-8">
<button class="material-symbols-outlined text-outline hover:text-primary transition-all hover:scale-110" data-icon="skip_previous" style="font-variation-settings: 'FILL' 1;">skip_previous</button>
<button class="w-16 h-16 rounded-full bg-primary-fixed text-on-primary flex justify-center items-center shadow-[0_0_20px_rgba(255,255,255,0.2)] hover:shadow-[0_0_30px_rgba(255,255,255,0.4)] transition-all hover:scale-105 active:scale-95" id="playPauseBtn">
<span class="material-symbols-outlined text-[32px]" data-icon="pause" id="playIcon" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="material-symbols-outlined text-outline hover:text-primary transition-all hover:scale-110" data-icon="skip_next" style="font-variation-settings: 'FILL' 1;">skip_next</button>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full flex justify-between items-center pt-4 border-t border-white/5">
<button class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors text-sm" data-icon="volume_up">volume_up</button>
<button class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors text-sm" data-icon="favorite">favorite</button>
<button class="material-symbols-outlined text-outline-variant hover:text-primary transition-colors text-sm" data-icon="cast">cast</button>
</div>
</main>
<script>
        const playBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const record = document.querySelector('.vinyl-record');
        const tonearm = document.querySelector('.origin-top-left');
        let isPlaying = true;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.textContent = 'pause';
                record.style.animationPlayState = 'running';
                tonearm.style.transform = 'rotate(12deg)';
            } else {
                playIcon.textContent = 'play_arrow';
                record.style.animationPlayState = 'paused';
                tonearm.style.transform = 'rotate(0deg)';
            }
        });
    </script>
</body></html>
