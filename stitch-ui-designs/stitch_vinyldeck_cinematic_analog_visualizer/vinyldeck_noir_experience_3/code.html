<style>
        .vinyl-grooves {
            background: repeating-radial-gradient(
                #111 0%,
                #111 2%,
                #222 2.5%,
                #111 3%
            );
        }
        .bloom-effect {
            box-shadow: 0 0 100px 40px rgba(100, 150, 255, 0.1);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinning {
            animation: spin 8s linear infinite;
        }
        .glass-panel {
            background: rgba(20, 19, 19, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden relative font-body-md">
<!-- Ambient Blur Background -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-cover bg-center opacity-30 blur-3xl scale-110" data-alt="Abstract dark cinematic background with soft glowing deep blues and purples. The mood is calm, premium, and analog-nostalgic. The lighting is soft and bloomy, resembling an out-of-focus album cover in a dimly lit, high-end listening room. Deep OLED blacks dominate the space." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDmsydhoc6ksgJNrTokQ80Etjyxs_2NejBsWlA8xNpNvODpANv7yxYqaOpU_Fsszzo_Vu-177c8rbvpemxMbQhtv3Y185e_7kJUmA9dkbio9PAkGgqJexKSSl4uujdm8rX83pSXtMPi6Xw9U7cMNGtX2jYK-wy0h8SKLSz9seRcOgqhHbkf29-xdhvJEieOC3RUnD2DaMoapgVPfNDv_XGD9ospANuZ_-h07e0BXkYEyw6p9oZN4sAvnJAeIssbQnoaeLAsT4cBDWye')"></div>
<div class="absolute inset-0 bg-background/60"></div>
</div>
<!-- Top Navigation (Generated from JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-desktop py-4 bg-transparent backdrop-blur-xl bg-surface/10 border-b border-white/10 hidden md:flex">
<div class="font-display-xl text-primary tracking-tighter text-4xl">VinylDeck</div>
<nav class="flex gap-8 items-center">
<a class="font-label-caps text-label-caps text-on-surface-variant font-medium hover:text-primary transition-colors duration-300" href="#">Collection</a>
<a class="font-label-caps text-label-caps text-primary font-bold border-b-2 border-primary pb-1" href="#">Discovery</a>
<a class="font-label-caps text-label-caps text-on-surface-variant font-medium hover:text-primary transition-colors duration-300" href="#">Studios</a>
</nav>
<div class="flex gap-4 items-center">
<button class="text-on-surface-variant hover:text-primary transition-colors duration-300">
<span class="material-symbols-outlined">palette</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors duration-300">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Side Navigation (Mobile/Fallback) - Hidden on Desktop -->
<aside class="fixed left-0 top-0 h-full flex flex-col p-6 z-40 bg-surface-container-lowest/80 h-screen w-64 rounded-r-xl backdrop-blur-3xl border-r border-white/5 shadow-2xl md:hidden">
<div class="font-headline-lg text-primary mb-8">Collector</div>
<nav class="flex flex-col gap-4 flex-grow">
<a class="flex items-center gap-4 text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/30 transition-all p-3 rounded-lg font-label-caps text-label-caps" href="#">
<span class="material-symbols-outlined">library_music</span> Library
            </a>
<a class="flex items-center gap-4 text-primary bg-primary-container/20 rounded-lg p-3 font-label-caps text-label-caps" href="#">
<span class="material-symbols-outlined">album</span> Turntable
            </a>
<a class="flex items-center gap-4 text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/30 transition-all p-3 rounded-lg font-label-caps text-label-caps" href="#">
<span class="material-symbols-outlined">settings_input_component</span> Radio
            </a>
<a class="flex items-center gap-4 text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/30 transition-all p-3 rounded-lg font-label-caps text-label-caps mt-auto" href="#">
<span class="material-symbols-outlined">settings</span> Settings
            </a>
</nav>
</aside>
<!-- Main Player Canvas -->
<main class="relative z-10 w-full h-screen flex flex-col items-center justify-center pt-20">
<!-- Turntable Area -->
<div class="relative flex items-center justify-center w-full max-w-[800px] aspect-square mx-auto">
<!-- The Platter (Record) -->
<div class="absolute w-[80%] h-[80%] rounded-full bg-[#0a0a0a] shadow-2xl bloom-effect flex items-center justify-center vinyl-grooves spinning inner-shadow-platter border border-white/5">
<!-- Inner Label (Album Art) -->
<div class="w-[30%] h-[30%] rounded-full overflow-hidden border-2 border-surface-variant shadow-inner flex items-center justify-center relative bg-surface-container-highest">
<img alt="Album Cover" class="w-full h-full object-cover" data-alt="A stylized album cover design featuring deep, moody colors with soft blue and purple gradients. The visual style is highly cinematic, minimal, and premium, evoking a sense of analog nostalgia. The image represents the center label of a high-fidelity vinyl record playing in a dark, OLED-black interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3-qkqzXGvGBDDACpNKNhfZKeTS3nKaOBPD6_olxSlw_5HRYMHaOssbyMjLR62Oz4lRfeinIstZ2NB6xlLrZVbiWTLGkcbDY6nWymrw4CctqHn-FWzeQpgCu_wG3jxedqzFwmsr_ufv3O-EwKBEbadSUVq_0U1AWK5wVNLpElhHE_cswJtLEyNzbdngv-NmFGDYvdiRC_GoN0Ba2hrolgE8PCgzGr_oRkJrR6Y_QlnR1DoEYI3AfIIoXCvQ_kqcW6BuPxQBaePVu1O"/>
<div class="absolute w-4 h-4 bg-background rounded-full shadow-inner border border-white/10"></div> <!-- Center spindle hole -->
</div>
</div>
<!-- Tonearm -->
<div class="absolute top-[10%] right-[10%] w-[40px] h-[300px] origin-top transform rotate-12 transition-transform duration-1000">
<!-- Base -->
<div class="w-16 h-16 bg-surface-container rounded-full absolute -top-8 -left-6 border border-white/20 shadow-xl flex items-center justify-center">
<div class="w-10 h-10 bg-gradient-to-b from-gray-400 to-gray-700 rounded-full shadow-inner"></div>
</div>
<!-- Arm -->
<div class="w-2 h-full bg-gradient-to-r from-gray-400 via-gray-200 to-gray-500 rounded-full absolute left-1/2 -translate-x-1/2 shadow-lg border-x border-white/30"></div>
<!-- Headshell -->
<div class="absolute bottom-[-20px] left-[-15px] w-10 h-16 bg-surface-container-high rounded-sm shadow-2xl border border-white/10 transform -rotate-12">
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-1 h-3 bg-red-500/50 rounded-full"></div> <!-- Stylus indicator -->
</div>
</div>
</div>
<!-- Bottom Controls Glass Panel -->
<div class="fixed bottom-0 left-0 w-full glass-panel px-margin-desktop py-8 flex items-end justify-between z-50">

<div class="flex-1">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-2">Midnight Echoes</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant">THE ANALOG ARCHITECTS • 1984</p>
</div>
<!-- Playback Controls -->
<div class="flex-1 flex flex-col items-center gap-6">
<div class="flex items-center gap-8">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">skip_previous</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center hover:bg-primary/20 transition-all bloom-effect">
<span class="material-symbols-outlined text-primary" style="font-size: 32px; font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">skip_next</span>
</button>
</div>
<!-- Timeline -->
<div class="w-full max-w-md flex items-center gap-4">
<span class="font-label-caps text-label-caps text-on-surface-variant text-[10px]">02:14</span>
<div class="flex-1 h-1 bg-surface-container-highest rounded-full overflow-hidden shadow-inner">
<div class="w-1/3 h-full bg-primary rounded-full relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-primary rounded-full shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>
</div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant text-[10px]">05:30</span>
</div>
</div>
<!-- Volume/Extra -->
<div class="flex-1 flex justify-end items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant text-sm">volume_down</span>
<div class="w-24 h-1 bg-surface-container-highest rounded-full shadow-inner">
<div class="w-2/3 h-full bg-on-surface-variant rounded-full"></div>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm">volume_up</span>
</div>
</div>
</main>
<script>
        // Simple interaction for tonearm
        const tonearm = document.querySelector('.transform.rotate-12');
        const playBtn = document.querySelector('button .material-symbols-outlined:contains("pause")')?.parentElement;
        let isPlaying = true;

        if(playBtn) {
            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                const icon = playBtn.querySelector('span');
                if(isPlaying) {
                    icon.textContent = 'pause';
                    tonearm.style.transform = 'rotate(12deg)';
                    document.querySelector('.vinyl-grooves').style.animationPlayState = 'running';
                } else {
                    icon.textContent = 'play_arrow';
                    tonearm.style.transform = 'rotate(0deg)';
                    document.querySelector('.vinyl-grooves').style.animationPlayState = 'paused';
                }
            });
        }
    </script>
</body></html>
