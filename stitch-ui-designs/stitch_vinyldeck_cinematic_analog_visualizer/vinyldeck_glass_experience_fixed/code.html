<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .glass-button {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            border-top: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }

        .vinyl-grooves {
            background: repeating-radial-gradient(
                #111 0, 
                #111 2px, 
                #1a1a1a 3px, 
                #1a1a1a 4px
            );
        }
        
        .spin {
            animation: spin 4s linear infinite;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        
        .prismatic-glow {
            background: radial-gradient(circle at 50% 50%, rgba(207, 188, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Desktop) -->
<header class="hidden md:flex fixed top-0 w-full z-50 glass-panel bg-transparent justify-between items-center px-gutter py-4 max-w-none">
<div class="font-display-lg text-display-lg tracking-tighter text-primary dark:text-primary">VinylDeck</div>
<nav class="flex gap-gutter">
<a class="font-headline-md text-headline-md text-on-surface-variant dark:text-on-surface-variant hover:text-primary transition-colors duration-300 active:scale-95 transition-transform" href="#">Collection</a>
<a class="font-headline-md text-headline-md text-primary dark:text-primary border-b-2 border-primary pb-1 hover:text-primary transition-colors duration-300 active:scale-95 transition-transform" href="#">Discovery</a>
<a class="font-headline-md text-headline-md text-on-surface-variant dark:text-on-surface-variant hover:text-primary transition-colors duration-300 active:scale-95 transition-transform" href="#">Studios</a>
</nav>
<div class="flex gap-unit">
<button class="p-2 text-on-surface-variant hover:text-primary transition-colors duration-300 active:scale-95 transition-transform"><span class="material-symbols-outlined">settings</span></button>
<button class="p-2 text-on-surface-variant hover:text-primary transition-colors duration-300 active:scale-95 transition-transform"><span class="material-symbols-outlined">account_circle</span></button>
</div>
</header>
<!-- Side Nav (Desktop) -->
<aside class="hidden md:flex h-full w-64 fixed left-0 top-0 z-[60] glass-panel bg-transparent border-r border-white/10 flex-col p-4 pt-32">
<div class="mb-8 px-4">
<div class="font-headline-md text-headline-md text-primary">VinylDeck Pro</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">Noir Edition Active</div>
</div>
<nav class="flex flex-col gap-2 flex-grow">
<a class="flex items-center gap-4 px-4 py-3 font-body-lg text-body-lg text-on-surface-variant hover:bg-white/5 transition-all active:translate-x-1 transition-transform rounded-xl" href="#"><span class="material-symbols-outlined">subscriptions</span>Library</a>
<a class="flex items-center gap-4 px-4 py-3 font-body-lg text-body-lg bg-white/10 text-primary border border-white/10 rounded-full hover:bg-white/20 transition-all active:translate-x-1 transition-transform backdrop-blur-md" href="#"><span class="material-symbols-outlined">graphic_eq</span>Live</a>
<a class="flex items-center gap-4 px-4 py-3 font-body-lg text-body-lg text-on-surface-variant hover:bg-white/5 transition-all active:translate-x-1 transition-transform rounded-xl" href="#"><span class="material-symbols-outlined">settings_input_component</span>Studios</a>
<a class="flex items-center gap-4 px-4 py-3 font-body-lg text-body-lg text-on-surface-variant hover:bg-white/5 transition-all active:translate-x-1 transition-transform rounded-xl" href="#"><span class="material-symbols-outlined">lock</span>Vault</a>
</nav>
</aside>
<!-- Main Content Area -->
<main class="md:ml-64 pt-24 pb-32 md:pb-8 px-4 md:px-gutter min-h-screen relative flex flex-col md:flex-row gap-gutter justify-center items-center">
<!-- Background Prismatic Effect -->
<div class="absolute inset-0 prismatic-glow z-0"></div>
<!-- Left Column: Now Playing Info (Glass Card) -->
<div class="z-10 w-full md:w-1/3 glass-panel rounded-[2rem] p-8 flex flex-col gap-6 relative overflow-hidden bg-transparent">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/20 blur-3xl rounded-full translate-x-1/2 -translate-y-1/2"></div>
<div class="flex justify-between items-start">
<span class="font-label-mono text-label-mono text-tertiary">NOW PLAYING</span>
<span class="material-symbols-outlined text-outline">more_horiz</span>
</div>
<div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Midnight Glass</h1>
<h2 class="font-headline-md text-headline-md text-primary/80">Echoes &amp; Artifacts</h2>
</div>
<!-- Fader / Progress -->
<div class="mt-8 flex flex-col gap-2">
<div class="flex justify-between font-label-mono text-label-mono text-on-surface-variant">
<span>02:14</span>
<span>05:30</span>
</div>
<div class="h-2 bg-black/20 rounded-full overflow-hidden relative border border-white/10 backdrop-blur-sm">
<div class="absolute top-0 left-0 h-full w-[40%] bg-primary/80 rounded-full relative">
<!-- Fader Thumb reflection -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-6 glass-button rounded-sm shadow-md"></div>
</div>
</div>
</div>
<!-- Controls -->
<div class="flex justify-center items-center gap-6 mt-4">
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_previous</span></button>
<button class="w-16 h-16 rounded-full glass-button flex items-center justify-center text-on-surface shadow-lg hover:bg-white/10 transition-colors border border-white/20"><span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span></button>
<button class="p-3 text-on-surface-variant hover:text-primary transition-colors"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_next</span></button>
</div>
</div>
<!-- Right Column: The Platter -->
<div class="z-10 w-full md:w-1/2 flex justify-center items-center relative aspect-square max-w-[600px]">
<!-- Outer Glass Ring -->
<div class="absolute inset-4 glass-panel rounded-full border border-white/10 shadow-2xl flex items-center justify-center bg-transparent">
<!-- Turntable Base shadow/depth -->
<div class="absolute inset-8 rounded-full bg-black/20 backdrop-blur-md shadow-[inset_0_10px_30px_rgba(0,0,0,0.8)] border border-white/5"></div>
<!-- The Vinyl -->
<div class="w-[85%] h-[85%] rounded-full vinyl-grooves relative shadow-2xl flex items-center justify-center spin" id="vinyl-record">
<!-- Reflection Highlight -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/10 to-transparent mix-blend-overlay"></div>
<!-- Center Label -->
<div class="w-1/3 h-1/3 rounded-full bg-surface-bright relative flex items-center justify-center border-4 border-[#111] overflow-hidden">
<!-- Record Label Art -->
<div class="absolute inset-0 bg-gradient-to-br from-primary-container to-secondary-container opacity-80 backdrop-blur-xl"></div>
<div class="z-10 w-3 h-3 rounded-full glass-button shadow-inner border border-white/30"></div>
</div>
</div>
<!-- Stylus Arm -->
<div class="absolute top-[10%] right-[10%] w-8 h-[40%] bg-gradient-to-b from-white/20 to-white/5 rounded-full origin-top transform rotate-12 shadow-2xl border border-white/20 z-20 glass-panel backdrop-blur-lg">
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-6 h-12 glass-button rounded-sm border border-white/30 shadow-lg"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Nav Bar (Mobile) -->
<nav class="md:hidden fixed bottom-0 w-full rounded-t-3xl z-50 glass-panel bg-transparent border-t border-white/10 shadow-[0_-8px_30px_rgb(0,0,0,0.12)] left-0 flex justify-around items-center px-container-padding pb-8 pt-4">
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:text-primary transition-all duration-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">album</span>
<span class="font-label-mono text-label-mono mt-1">Deck</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:text-primary transition-all duration-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">equalizer</span>
<span class="font-label-mono text-label-mono mt-1">Mixer</span>
</a>
<a class="flex flex-col items-center justify-center glass-button text-primary border border-white/20 rounded-full p-3 scale-110 shadow-lg hover:bg-white/10 transition-all duration-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-mono text-label-mono mt-1">Crate</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-3 hover:text-primary transition-all duration-300 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined">radio</span>
<span class="font-label-mono text-label-mono mt-1">Tuner</span>
</a>
</nav>
<script>
        // Simple play/pause toggle for visual effect
        document.querySelector('button .material-symbols-outlined:contains("play_arrow")')?.parentElement.addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            const vinyl = document.getElementById('vinyl-record');
            
            if (icon.textContent === 'play_arrow') {
                icon.textContent = 'pause';
                vinyl.style.animationPlayState = 'running';
            } else {
                icon.textContent = 'play_arrow';
                vinyl.style.animationPlayState = 'paused';
            }
        });
        
        // Helper to simulate jQuery :contains selector
        Element.prototype.contains = function(text) {
            return this.textContent.includes(text);
        };
    </script>
</body></html>
