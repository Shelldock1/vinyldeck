<style>
        body {
            background-image: radial-gradient(circle at 50% 50%, #201f1f 0%, #141313 100%);
            background-attachment: fixed;
        }
        
        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(20, 19, 19, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Inner Shadow for recessed areas */
        .recessed-well {
            background: linear-gradient(145deg, #0e0e0e, #1c1b1b);
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.8), inset -4px -4px 8px rgba(42,42,42,0.4);
        }

        /* Vinyl Spin Animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }

        /* Progress Ring */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Ambient Bloom */
        .ambient-bloom {
            box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s ease;
        }
        .ambient-bloom:hover {
            box-shadow: 0 0 60px 15px rgba(255, 255, 255, 0.08);
        }
        
        .ambient-glow-primary {
            box-shadow: 0 0 20px 2px rgba(226, 226, 226, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-8 antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Mini Player Widget Container -->
<main class="relative w-full max-w-[320px] mx-auto z-10 group">
<!-- Ambient Background Glow -->
<div class="absolute -inset-4 bg-primary/5 rounded-[2rem] blur-2xl opacity-50 group-hover:opacity-70 transition-opacity duration-700 pointer-events-none"></div>
<!-- Main Chassis -->
<article class="glass-panel rounded-3xl overflow-hidden flex flex-col relative z-20 h-[600px] border border-outline-variant/30">
<!-- Top Drag Handle / Status -->
<header class="w-full h-12 flex items-center justify-between px-6 pt-2 shrink-0">
<span class="material-symbols-outlined text-on-surface-variant text-[18px] cursor-grab active:cursor-grabbing hover:text-primary transition-colors">drag_indicator</span>
<div class="font-label-caps text-label-caps text-on-surface-variant tracking-widest flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary shadow-[0_0_8px_#ffffff] animate-pulse"></span>
                    HI-RES AUDIO
                </div>
<span class="material-symbols-outlined text-on-surface-variant text-[18px] cursor-pointer hover:text-primary transition-colors" data-icon="more_horiz">more_horiz</span>
</header>
<!-- Platter Section -->
<section class="flex-1 flex items-center justify-center relative px-8 py-4">
<!-- Recessed Well for Platter -->
<div class="relative w-[240px] h-[240px] rounded-full recessed-well flex items-center justify-center">
<!-- Progress Ring (Subtle Glow) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none -m-1" height="248" viewbox="0 0 248 248" width="248">
<!-- Track -->
<circle class="text-surface-container-highest" cx="124" cy="124" fill="transparent" opacity="0.3" r="122" stroke="currentColor" stroke-width="2"></circle>
<!-- Progress -->
<circle class="progress-ring__circle text-primary" cx="124" cy="124" fill="transparent" r="122" stroke="currentColor" stroke-linecap="round" stroke-width="3" style="stroke-dasharray: 766; stroke-dashoffset: 200; filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));"></circle>
</svg>
<!-- The Vinyl Record -->
<div class="w-[220px] h-[220px] rounded-full bg-surface-container-lowest border border-outline-variant/20 relative shadow-2xl overflow-hidden animate-spin-slow" id="vinyl-record">
<!-- Vinyl Grooves Texture -->
<div class="absolute inset-0 rounded-full" style="background: repeating-radial-gradient(#141313, #141313 2px, #1c1b1b 3px, #141313 4px); opacity: 0.8;"></div>
<!-- Highlights simulating lighting -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/5 to-transparent mix-blend-overlay"></div>
<div class="absolute inset-0 rounded-full bg-[conic-gradient(from_0deg,transparent_0deg,rgba(255,255,255,0.1)_45deg,transparent_90deg,transparent_180deg,rgba(255,255,255,0.1)_225deg,transparent_270deg)]"></div>
<!-- Center Label -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full bg-surface-container shadow-inner border border-outline-variant/30 overflow-hidden flex items-center justify-center">
<!-- Album Art in Center -->
<img alt="Album Art" class="w-full h-full object-cover opacity-80" data-alt="A moody, high-contrast close up of an abstract architectural shape, heavily textured with cinematic film grain. The lighting is dramatic, casting deep black shadows against warm, metallic amber highlights. The aesthetic is sophisticated, tactile, and reminiscent of vintage 70s sci-fi album covers." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1DRzBChrNE0l_MJYMlTcMaoJkfHUjnmBN4kMxuHWBxJ3MjOmsmk55wQu3BKVPgeGixGiR_VUNmiJ_8N6W_tKOj5jIE_c809jAKmbxhBPkoM_8sQpqLN6qccZi4d5U7E5ZBbhvndQslkn659p8bFAJxbo9rTVE0uwI0FBdmYwnsXC1FZxknILbiVz_vfgmBtQnqfP4d-K7ua5f_N1o_2yUYuJrNdM2ZdNH129i_mRX_GHB6dDthNHFbc-otQmzUVioPRdPDrBxXBab"/>
<!-- Spindle Hole -->
<div class="absolute w-2 h-2 rounded-full bg-surface-container-lowest shadow-inner border border-surface-bright z-10"></div>
</div>
</div>
<!-- Tonearm Hint (Abstracted) -->
<div class="absolute -right-4 top-1/2 w-8 h-32 bg-gradient-to-b from-outline-variant to-surface-container-highest rounded-full shadow-lg border border-outline-variant/50 transform -translate-y-1/2 origin-top rotate-12 opacity-80 pointer-events-none">
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-4 h-6 bg-surface-container-lowest rounded-sm border border-outline-variant/50"></div>
</div>
</div>
</section>
<!-- Metadata Section -->
<section class="px-8 pb-6 flex flex-col items-center text-center shrink-0">
<h2 class="font-headline-lg text-[24px] leading-tight font-bold text-primary mb-1 truncate w-full">Midnight City</h2>
<h3 class="font-body-md text-body-md text-on-surface-variant truncate w-full mb-3">M83 • Hurry Up, We're Dreaming</h3>
<!-- Format Badges -->
<div class="flex gap-2 justify-center w-full">
<span class="px-2 py-0.5 rounded border border-outline-variant/50 font-label-caps text-[10px] text-on-surface-variant bg-surface-container/50">FLAC</span>
<span class="px-2 py-0.5 rounded border border-outline-variant/50 font-label-caps text-[10px] text-on-surface-variant bg-surface-container/50">24-BIT</span>
<span class="px-2 py-0.5 rounded border border-outline-variant/50 font-label-caps text-[10px] text-on-surface-variant bg-surface-container/50">192KHZ</span>
</div>
</section>
<!-- Transport Controls -->
<footer class="w-full px-8 pb-8 pt-4 bg-surface-container-low/50 border-t border-white/5 shrink-0">
<div class="flex items-center justify-between w-full max-w-[240px] mx-auto">
<!-- Previous -->
<button aria-label="Previous Track" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all active:scale-95 border border-transparent hover:border-outline-variant/30 group">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<!-- Play/Pause (Machined Aluminum Style) -->
<button aria-label="Play or Pause" class="w-16 h-16 rounded-full flex items-center justify-center bg-gradient-to-b from-surface-container-highest to-surface-container border border-outline-variant/50 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),0_8px_16px_rgba(0,0,0,0.5)] active:shadow-[inset_0_2px_4px_rgba(0,0,0,0.5),0_2px_4px_rgba(0,0,0,0.5)] active:scale-[0.98] transition-all group ambient-glow-primary" id="play-pause-btn">
<span class="material-symbols-outlined text-[32px] text-primary transition-transform group-hover:scale-110" id="play-icon" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Next -->
<button aria-label="Next Track" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all active:scale-95 border border-transparent hover:border-outline-variant/30 group">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
<!-- Secondary Controls (Volume/Heart) -->
<div class="flex items-center justify-between mt-6 px-2">
<button aria-label="Volume" class="text-on-surface-variant hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
<!-- Time Display -->
<div class="font-label-caps text-[11px] text-on-surface-variant tracking-wider">
                        02:14 <span class="opacity-50">/ 04:03</span>
</div>
<button aria-label="Like" class="text-on-surface-variant hover:text-error transition-colors active:scale-90">
<span class="material-symbols-outlined text-[20px]">favorite</span>
</button>
</div>
</footer>
</article>
</main>
<script>
        // Simple micro-interaction for Play/Pause
        document.addEventListener('DOMContentLoaded', () => {
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const vinylRecord = document.getElementById('vinyl-record');
            let isPlaying = true;

            playPauseBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                
                if (isPlaying) {
                    playIcon.textContent = 'pause';
                    vinylRecord.classList.remove('paused');
                    playPauseBtn.classList.add('ambient-glow-primary');
                } else {
                    playIcon.textContent = 'play_arrow';
                    vinylRecord.classList.add('paused');
                    playPauseBtn.classList.remove('ambient-glow-primary');
                }
                
                // Add a small tactile 'bump' animation to the button
                playPauseBtn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    playPauseBtn.style.transform = '';
                }, 100);
            });
        });
    </script>
</body></html>
