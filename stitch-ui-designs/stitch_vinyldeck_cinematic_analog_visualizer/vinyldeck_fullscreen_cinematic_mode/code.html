<style>
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
        
        .vignette-heavy {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 90;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.95) 100%);
        }

        .vinyl-grooves-meditative {
            background: repeating-radial-gradient(
                #030303 0%,
                #030303 0.2%,
                #0a0a0a 0.4%,
                #030303 0.6%
            );
            position: relative;
            box-shadow: 
                inset 0 0 60px rgba(0,0,0,0.95),
                0 30px 80px rgba(0,0,0,0.9),
                0 0 40px rgba(255,255,255,0.02);
        }
        
        .vinyl-reflection-soft {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(255,255,255,0.03) 15%,
                transparent 30%,
                transparent 50%,
                rgba(255,255,255,0.02) 65%,
                transparent 80%,
                transparent 100%
            );
            mix-blend-mode: screen;
            pointer-events: none;
            transition: transform 0.5s ease-out;
        }

        @keyframes breathe {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        .breathing-glow {
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .progress-ring-container {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .progress-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            mask-image: conic-gradient(from -90deg, #fff 40%, transparent 40%);
            -webkit-mask-image: conic-gradient(from -90deg, #fff 40%, transparent 40%);
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .progress-dot {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff;
            transform-origin: 50% calc(50% + 450px); /* Adjust based on platter size */
        }
        
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .spinning-slow {
            animation: spin-slow 8s linear infinite; /* Slower for meditative feel */
        }

        .tonearm-transition {
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .brushed-metal-dark {
            background: linear-gradient(90deg, #333 0%, #555 20%, #222 50%, #555 80%, #333 100%);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), inset 0 -1px 2px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.8);
        }

        /* Hover UI Reveal */
        .hover-ui {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        body:hover .hover-ui {
            opacity: 1;
        }

        /* Particle System */
        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Parallax Layer */
        .parallax-bg {
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

<script>
        const tonearm = document.getElementById('tonearm-assembly');
        const playBtn = document.getElementById('play-pause-btn');
        const recordPlatter = document.getElementById('record-platter');
        const parallaxContainer = document.getElementById('parallax-container');
        const vinylReflection = document.getElementById('vinyl-reflection');
        let isPlaying = true;

        // Play/Pause Logic
        if(playBtn) {
            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                const icon = playBtn.querySelector('span');
                
                if(isPlaying) {
                    icon.textContent = 'pause';
                    tonearm.style.transform = 'rotate(18deg)';
                    recordPlatter.style.animationPlayState = 'running';
                } else {
                    icon.textContent = 'play_arrow';
                    tonearm.style.transform = 'rotate(0deg)';
                    recordPlatter.style.animationPlayState = 'paused';
                }
            });
        }

        // Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            
            if(parallaxContainer) {
                parallaxContainer.style.transform = `translate(${x}px, ${y}px)`;
            }
            if(vinylReflection) {
                vinylReflection.style.transform = `translate(${x * -0.5}px, ${y * -0.5}px)`;
            }
        });

        // Simple Particle System
        const particleContainer = document.getElementById('particles');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
            createParticle();
        }

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize properties
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const duration = Math.random() * 10 + 10;
            const delay = Math.random() * 10;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}vw`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;
            
            particleContainer.appendChild(particle);

            // Recreate particle when animation ends to keep it looping infinitely
            particle.addEventListener('animationend', () => {
                particle.remove();
                createParticle();
            });
        }
    </script>
