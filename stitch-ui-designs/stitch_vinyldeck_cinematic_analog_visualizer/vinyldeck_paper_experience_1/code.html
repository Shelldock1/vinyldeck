<style>
        /* Paper theme specific styles */
        body {
            /* Warm cream base with subtle noise texture simulated by color */
            background-color: #f5f0e6; 
            color: #3e2e00; /* Warm dark brown text */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        .paper-card {
            background-color: #ffffff;
            box-shadow: 4px 8px 12px rgba(0, 0, 0, 0.05), 
                        inset 0 0 0 1px rgba(231, 195, 101, 0.1); /* bronze accent border */
            border-radius: 0.25rem;
        }

        .vinyl-platter {
            background: radial-gradient(circle, #222 10%, #111 50%, #000 90%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 
                        0 4px 20px rgba(0,0,0,0.2),
                        0 0 0 4px #e7c365; /* Bronze edge */
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }
        
        .vinyl-grooves {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-radial-gradient(
                circle,
                transparent,
                transparent 4px,
                rgba(255,255,255,0.03) 5px,
                transparent 6px
            );
            border-radius: 50%;
        }

        .record-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30%; height: 30%;
            background-color: #c9a74d; /* Tertiary container / warm bronze */
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .record-hole {
            width: 5%; height: 5%;
            background-color: #f5f0e6;
            border-radius: 50%;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .tonearm {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 10px;
            height: 40%;
            background: linear-gradient(90deg, #b08d57, #e7c365, #b08d57); /* Brass gradient */
            transform-origin: top center;
            transform: rotate(-15deg);
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .tonearm-base {
            position: absolute;
            top: 8%;
            right: 8%;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #555, #222);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 2px solid #e7c365;
        }

        .playing .vinyl-platter {
            animation: spin 4s linear infinite;
        }
        
        .playing .tonearm {
            transform: rotate(15deg);
            transition: transform 1s ease;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Override dark mode for this specific theme since it's light/cream based */
        .dark .text-primary, .dark .text-on-surface-variant {
            color: #3e2e00; /* Force dark text on cream bg */
        }
        
        .dark .bg-surface\/80 {
            background-color: rgba(245, 240, 230, 0.9); /* Cream bg for nav */
        }
    </style>

<script>
        // Simple play interaction
        const playBtn = document.getElementById('playBtn');
        const turntable = document.querySelector('.relative.w-full.aspect-square');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                turntable.classList.add('playing');
                playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">pause</span>';
            } else {
                turntable.classList.remove('playing');
                playBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">play_arrow</span>';
            }
        });
    </script>
