<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VinylDeck - Play</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            /* CRT Scanline effect */
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
        }
        
        .glow-ambient {
            box-shadow: 0 0 60px -10px theme('colors.primary');
        }

        .vinyl-spin {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .groove-shimmer {
            background: repeating-radial-gradient(
                circle at center,
                rgba(255,255,255,0.03) 0,
                rgba(255,255,255,0.03) 1px,
                transparent 1px,
                transparent 4px
            );
        }
        
        /* The Grid */
        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(254, 169, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(254, 169, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: bottom;
            animation: moveGrid 10s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 50px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden relative">
<div class="cyber-grid"></div>
<div class="fixed inset-0 bg-gradient-to-t from-background via-transparent to-background/50 z-[-1] pointer-events-none"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full bg-transparent border-b border-white/5">
<div class="flex items-center gap-unit">
<span class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg tracking-tighter text-primary">VinylDeck</span>
</div>
<nav class="hidden md:flex gap-gutter items-center h-full">
<a class="font-label-mono text-label-mono text-on-secondary-container hover:text-primary transition-colors duration-300 cursor-pointer h-full flex items-center" href="#">Collection</a>
<a class="font-label-mono text-label-mono text-primary border-b border-primary pb-1 h-full flex items-center mt-1" href="#">Discovery</a>
<a class="font-label-mono text-label-mono text-on-secondary-container hover:text-primary transition-colors duration-300 cursor-pointer h-full flex items-center" href="#">Studios</a>
</nav>
<div class="flex items-center gap-gutter">
<button class="text-on-secondary-container hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-70">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="text-on-secondary-container hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-70">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-28 pb-32 px-margin-mobile md:px-margin-desktop max-w-[1440px] mx-auto w-full flex flex-col md:flex-row gap-8 relative z-10">
<!-- Left Column: Player -->
<section class="flex-1 flex flex-col items-center justify-center">
<!-- Vinyl Record -->
<div class="relative w-72 h-72 md:w-96 md:h-96 rounded-full bg-surface-container-highest border border-outline-variant/30 glow-ambient flex items-center justify-center mb-8">
<!-- Record Grooves -->
<div class="absolute inset-2 rounded-full bg-background vinyl-spin groove-shimmer border border-white/10 shadow-inner overflow-hidden">
<!-- Reflection Highlight -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-primary/20 to-transparent transform -rotate-45"></div>
<div class="absolute inset-0 bg-gradient-to-bl from-transparent via-tertiary/20 to-transparent transform -rotate-45"></div>
<!-- Center Label -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full bg-gradient-to-br from-secondary-container to-primary-container border-2 border-surface-container flex items-center justify-center">
<div class="w-4 h-4 rounded-full bg-background border border-surface-variant z-10"></div>
<!-- Album Art Placeholder on Label -->
<img alt="Center label artwork" class="absolute inset-0 w-full h-full object-cover rounded-full opacity-50 mix-blend-overlay" data-alt="A macro shot of a vinyl record's center label. The label features vibrant, retro 80s synthwave graphics with deep magenta and cyan geometric shapes on a dark purple background. The surrounding vinyl grooves catch bright neon purple reflections in the dark, moody lighting. High contrast cinematic 1980s aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3i6ACsHLkC6I3AG0p3Vys3BHMMuZZSr1-qplNIRbXUakjmSewXlyE1W60q4X427XD6ecI7emRzNlrEkuNXt1OluC198aPFNP826QH1jQ73gBbbXVAaJRwc4T6fainuoCIievVWnXn2HFCWyFsCnwsIPSLPUKF5Ea2MV87cZzkbctuGHEp4tabA8C_eAx56zwA3uGo0zr2OZPWy51lt9MF2yXRMHCW6ubF2ML7jy-rNhIieQmebWmZXrPiOq9frK-bE0KdQr3Cpnsw"/>
</div>
</div>
<!-- Tone Arm -->
<div class="absolute top-[-10px] right-[-20px] w-48 h-64 origin-top-right transform rotate-12 transition-transform duration-1000 ease-in-out z-20 pointer-events-none">
<div class="w-12 h-12 rounded-full bg-surface-bright border border-outline-variant absolute top-0 right-0 shadow-lg"></div>
<div class="w-2 h-40 bg-gradient-to-r from-gray-400 to-gray-200 absolute top-8 right-5 rounded-full origin-top transform rotate-[-20deg]"></div>
<div class="w-6 h-10 bg-surface-variant border border-outline absolute bottom-2 right-16 transform rotate-[-20deg] rounded-sm flex items-end justify-center pb-1">
<div class="w-1 h-3 bg-red-500 rounded-sm"></div>
</div>
</div>
</div>
<!-- Track Info -->
<div class="text-center w-full max-w-md">
<h2 class="font-headline-md text-headline-md text-primary mb-2 truncate">Neon Nights Surfer</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-6">Midnight Syndic</p>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-high rounded-full relative mb-4">
<div class="absolute left-0 top-0 h-full w-1/3 bg-primary rounded-full shadow-[0_0_10px_theme('colors.primary')]"></div>
<!-- Playhead -->
<div class="absolute left-1/3 top-1/2 -translate-y-1/2 -translate-x-1/2 w-1 h-4 bg-tertiary shadow-[0_0_8px_theme('colors.tertiary')]"></div>
</div>
<div class="flex justify-between font-label-mono text-label-mono text-on-surface-variant">
<span>1:24</span>
<span>4:05</span>
</div>
</div>
</section>
<!-- Right Column: Queue / Bento -->
<section class="flex-1 flex flex-col gap-6">
<!-- Up Next Card -->
<div class="bg-surface-container/60 backdrop-blur-xl border-t border-white/20 border border-outline-variant/30 rounded-xl p-6 relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent pointer-events-none"></div>
<h3 class="font-label-mono text-label-mono text-secondary mb-4 uppercase tracking-widest">Up Next</h3>
<div class="flex items-center gap-4 p-3 -mx-3 rounded-lg hover:bg-surface-variant/50 transition-colors cursor-pointer">
<div class="w-12 h-12 rounded bg-surface-bright flex items-center justify-center border border-white/10 overflow-hidden relative">
<img alt="Album Art" class="w-full h-full object-cover" data-alt="Abstract gradient artwork reminiscent of 1980s airbrush art. Deep purple and magenta hues blending smoothly. Moody, neon-lit aesthetic, retro-futuristic style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCusdYkW2N_EeaKwlDV1JoTpnBQ_ouvOl-P5dpVAu4IQL3D6K0-PoVttXePhS87fVLa2mijoHiqNcnSeU_6y8W2Rt_fslgGZ1PGVrZx96zQZeINhXI5rHm0JY7Z8rFhsL5LPdHMxZsgznSxkTJ6XMWfNtHGhwYBZfF8Gl2UxDjzJUlIEAkCT4vRge66DtKcnmb2t_xU8DyWh-P2URw6gqHGqkWVXFc4OAWb3IjR0cosPOh7eNaokNSSDaTgdTY85QVQF9UPo9254QaB"/>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-on-surface truncate">Digital Frontier</p>
<p class="font-label-mono text-[12px] text-on-surface-variant truncate">Laser Hawk</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
<div class="flex items-center gap-4 p-3 -mx-3 rounded-lg hover:bg-surface-variant/50 transition-colors cursor-pointer">
<div class="w-12 h-12 rounded bg-surface-bright flex items-center justify-center border border-white/10 overflow-hidden relative">
<img alt="Album Art" class="w-full h-full object-cover" data-alt="Abstract geometric landscape in wireframe style. Glowing neon pink and cyan lines forming a grid over a dark, moody background. Synthwave, outrun aesthetic from the 1980s." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvE82bCxYa3cCuhWHjR-M0OYo8R6s56w7ZakI0yki7KT59MNmuKVC0Om5YrewfEdUWid9sBXHnJeeUTLtXHSIDBd8kVwSn8e4BA1_47OFVl6-Uen1-nwXc3RlBVf4RM0ZfEjo680G0BjEcOEfRsLjpwLdEGqeI622C7Q0PYeq5s5KzhfHJ3y1ON5U6kiKXoEtXkYvvUCtW6KN0Yg3f38ObpG70qlifKHxF2p8wuoBiMMJk9mIeTEmzY8RstL0-8vlGPU6SoFadNoJc"/>
</div>
<div class="flex-1 min-w-0">
<p class="font-body-md text-body-md text-on-surface truncate">Hyperdrive</p>
<p class="font-label-mono text-[12px] text-on-surface-variant truncate">The Grid</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
<!-- Stats / EQ Bento Box -->
<div class="grid grid-cols-2 gap-6 h-48">
<!-- EQ Visualizer -->
<div class="bg-surface-container/60 backdrop-blur-xl border-t border-white/20 border border-outline-variant/30 rounded-xl p-4 flex flex-col justify-between">
<h3 class="font-label-mono text-label-mono text-on-surface-variant uppercase">Levels</h3>
<div class="flex items-end gap-1 h-20 w-full justify-around opacity-80">
<div class="w-3 bg-gradient-to-t from-primary-container to-primary rounded-t-sm h-1/2"></div>
<div class="w-3 bg-gradient-to-t from-primary-container to-primary rounded-t-sm h-3/4"></div>
<div class="w-3 bg-gradient-to-t from-primary-container to-primary rounded-t-sm h-full"></div>
<div class="w-3 bg-gradient-to-t from-tertiary-container to-tertiary rounded-t-sm h-1/4"></div>
<div class="w-3 bg-gradient-to-t from-tertiary-container to-tertiary rounded-t-sm h-2/3"></div>
<div class="w-3 bg-gradient-to-t from-primary-container to-primary rounded-t-sm h-1/3"></div>
</div>
</div>
<!-- RPM Info -->
<div class="bg-surface-container/60 backdrop-blur-xl border-t border-white/20 border border-outline-variant/30 rounded-xl p-4 flex flex-col justify-center items-center text-center relative overflow-hidden">
<div class="absolute -right-4 -bottom-4 text-[100px] text-surface font-display-lg opacity-30 select-none">33</div>
<p class="font-label-mono text-label-mono text-secondary mb-1">SPEED</p>
<p class="font-headline-md text-headline-md text-primary">33 ⅓ <span class="font-body-md text-on-surface-variant">RPM</span></p>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-center items-center pb-8 px-margin-mobile bg-surface-container/80 backdrop-blur-xl border border-outline-variant/20 shadow-[0_0_20px_rgba(0,0,0,0.4)] md:hidden">
<div class="flex justify-between w-full max-w-sm pt-4">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-95 transition-all w-16">
<span class="material-symbols-outlined mb-1" data-icon="skip_previous">skip_previous</span>
<span class="font-data-mono text-[10px]">Previous</span>
</button>
<button class="flex flex-col items-center justify-center text-primary scale-110 hover:text-primary transition-transform duration-200 active:scale-95 transition-all w-16">
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center border border-primary/50 shadow-[0_0_15px_theme('colors.primary')] mb-1">
<span class="material-symbols-outlined text-primary" data-icon="play_arrow" data-weight="fill">play_arrow</span>
</div>
<span class="font-data-mono text-[10px]">Play</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-95 transition-all w-16">
<span class="material-symbols-outlined mb-1" data-icon="skip_next">skip_next</span>
<span class="font-data-mono text-[10px]">Next</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-95 transition-all w-16">
<span class="material-symbols-outlined mb-1" data-icon="queue_music">queue_music</span>
<span class="font-data-mono text-[10px]">Queue</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-transform duration-200 active:scale-95 transition-all w-16">
<span class="material-symbols-outlined mb-1" data-icon="notes">notes</span>
<span class="font-data-mono text-[10px]">Lyrics</span>
</button>
</div>
</nav>
<!-- Desktop Controls (Hidden on mobile) -->
<div class="hidden md:flex fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-surface-container/80 backdrop-blur-xl border border-outline-variant/30 rounded-full px-8 py-4 items-center gap-8 shadow-[0_0_30px_rgba(0,0,0,0.6)]">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="shuffle">shuffle</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="skip_previous">skip_previous</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary flex items-center justify-center hover:bg-primary-container transition-colors shadow-[0_0_20px_theme('colors.primary')]">
<span class="material-symbols-outlined text-background text-[40px]" data-icon="pause" data-weight="fill">pause</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="skip_next">skip_next</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="repeat">repeat</span>
</button>
</div>
</body></html>
