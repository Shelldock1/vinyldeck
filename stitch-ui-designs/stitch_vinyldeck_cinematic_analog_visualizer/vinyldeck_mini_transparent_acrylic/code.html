<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>VinylDeck Mini - Transparent Acrylic</title>

<style>.glass-panel {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1)
    }
.ambient-bloom {
    box-shadow: 0 0 60px rgba(255, 255, 255, 0.1)
    }
.vinyl-platter {
    background: radial-gradient(circle at center, #111 0%, #1a1a1a 100%);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8), 0 10px 20px rgba(0, 0, 0, 0.5);
    position: relative
    }
.vinyl-grooves {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.02)
    }
@keyframes spin {
    from {
        transform: rotate(0deg);
        } to {
        transform: rotate(360deg);
        }
    }
.spin-anim {
    animation: spin 4s linear infinite
    }
/* Subtle background for the demo */
body {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCjvwDwqTUSj2MsoUxZ_c6-3UMN7-btB88QoNDbPYyB10Pwx2QJYObwoxGLhTzKtInNeM42kI23riXLa_j7YfEbYS_PuAevYcxtTqynjRnMhkDlTT6LU6eCY8j_eq9xB6WFTEUgiUeq5CtfIc5juQ0l7rUcM7G0f73qvfcEWUavZRhs3prXzQuik71S5DKCs4Rf8EznstuM0EbI6yuPOJgbHZpZsim4uQAJ_F-qcYz-IGmNisM-XzYpm5TtMFS-1yRMZfdDz-zkhS6u);
    background-size: cover;
    background-position: center
    }
.bg-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(20, 19, 19, 0.7) 0%, rgba(20, 19, 19, 0.95) 100%);
    z-index: -1
    }</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden antialiased">
<div class="bg-overlay"></div>
<!-- Mini Player Container -->
<div class="glass-panel ambient-bloom rounded-[24px] w-[380px] p-6 relative overflow-hidden transition-transform duration-500 hover:scale-[1.02]">
<!-- Header -->
<div class="flex justify-between items-center mb-8">
<h1 class="font-headline-lg text-[20px] font-bold tracking-tight text-primary">VinylDeck <span class="font-light opacity-50">Mini</span></h1>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</div>
<!-- Vinyl Platter Display -->
<div class="relative w-full aspect-square flex items-center justify-center mb-8">
<div class="vinyl-platter w-48 h-48 rounded-full flex items-center justify-center spin-anim">
<!-- Grooves -->
<div class="vinyl-grooves w-[90%] h-[90%]"></div>
<div class="vinyl-grooves w-[80%] h-[80%]"></div>
<div class="vinyl-grooves w-[70%] h-[70%]"></div>
<div class="vinyl-grooves w-[60%] h-[60%]"></div>
<!-- Label (Album Art Placeholder) -->
<div class="w-16 h-16 rounded-full overflow-hidden border border-white/10 relative z-10 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
<img alt="Album art showing abstract fluid colors in deep blues and purples" class="w-full h-full object-cover" data-alt="A close-up abstract image featuring swirling fluid dynamics in deep, rich blues and vibrant purples. The texture appears smooth and glossy, like liquid glass or polished marble. Soft, diffused lighting highlights the fluid curves, creating a sophisticated and ethereal atmosphere that perfectly complements a high-end, dark-mode audio interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_6nGakM7BiHxHG5tkYXG-aeSmLAnIcRM_dhJCnpB2byDJrfnEPvmxDFl5KxpkcaKWLEfeHAlvxEOhUepaRTv325Z1-bpNtLZnkdPEv4wF4LQriuIK4w9lSkpECPC3KrRP-c71HpGS-qP609Ul2Rgoyvks6WnFgxux7V04eWQuLkdsjbJmTGPRL3zEK3aClwrhLM5Tb1WgSbHPYv7WkJ9CGoQUgjhGgMm6d-MLmMGSp83P-Z62Yb8Jn9FE18Dp9XGyBTWTbdmPC-TW"/>
<!-- Spindle hole -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-surface-container-lowest rounded-full border border-white/20"></div>
</div>
<!-- Highlight reflection -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/5 to-transparent pointer-events-none mix-blend-overlay"></div>
</div>
</div>
<!-- Track Info -->
<div class="text-center mb-8">
<h2 class="font-body-md text-primary font-semibold text-lg truncate">Midnight Echoes</h2>
<p class="font-body-md text-on-surface-variant text-sm truncate opacity-80 mt-1">The Analog Sessions</p>
</div>
<!-- Progress Bar -->
<div class="mb-6 group cursor-pointer">
<div class="h-1 bg-white/10 rounded-full overflow-hidden relative">
<!-- Inner shadow for depth -->
<div class="absolute inset-0 shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]"></div>
<!-- Progress -->
<div class="h-full bg-primary w-1/3 relative shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
</div>
<div class="flex justify-between mt-2 font-label-caps text-label-caps text-on-surface-variant opacity-60">
<span>01:42</span>
<span>04:15</span>
</div>
</div>
<!-- Controls -->
<div class="flex items-center justify-center gap-6">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-white/5 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button class="w-14 h-14 rounded-full bg-white/10 flex items-center justify-center text-primary border border-white/20 shadow-[inset_0_1px_0_rgba(255,255,255,0.2),0_4px_12px_rgba(0,0,0,0.3)] hover:bg-white/15 hover:shadow-[0_0_20px_rgba(255,255,255,0.1)] active:scale-95 transition-all">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-white/5 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
</div>
</body></html>
