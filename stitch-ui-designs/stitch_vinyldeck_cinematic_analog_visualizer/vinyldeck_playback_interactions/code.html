<style>
        .film-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            opacity: 0.04;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
        
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
        }

        .vinyl-grooves {
            background: repeating-radial-gradient(
                #0a0a0a 0%,
                #0a0a0a 0.5%,
                #111 0.7%,
                #0a0a0a 1%
            );
            position: relative;
            box-shadow: 
                inset 0 0 40px rgba(0,0,0,0.9),
                0 20px 50px rgba(0,0,0,0.8);
        }
        
        .vinyl-reflection {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(255,255,255,0.05) 10%,
                transparent 20%,
                transparent 40%,
                rgba(255,255,255,0.03) 50%,
                transparent 60%,
                transparent 80%,
                rgba(255,255,255,0.05) 90%,
                transparent 100%
            );
            mix-blend-mode: screen;
            pointer-events: none;
        }
        
        .groove-pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 30%, rgba(255,255,255,0.08) 60%, transparent 80%);
            mix-blend-mode: overlay;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        .is-playing .groove-pulse {
            opacity: 1;
            animation: pulse-ring 6s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 0.2; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }

        .bloom-effect {
            box-shadow: 0 0 120px 60px rgba(80, 120, 200, 0.03);
            transition: box-shadow 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .is-playing .bloom-effect {
            box-shadow: 0 0 160px 80px rgba(80, 120, 200, 0.12);
        }
        
        .glass-panel {
            background: linear-gradient(to bottom, rgba(30, 30, 30, 0.4), rgba(10, 10, 10, 0.8));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            border-radius: 24px 24px 0 0;
            margin: 0 24px;
            width: calc(100% - 48px);
            transition: border-color 1s ease, background 1s ease;
        }

        .is-playing .glass-panel {
            border-color: rgba(255, 255, 255, 0.15);
            background: linear-gradient(to bottom, rgba(40, 40, 40, 0.5), rgba(15, 15, 15, 0.9));
        }

        .play-btn-glow {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .is-playing .play-btn-glow {
            box-shadow: 0 0 30px rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.1);
        }

        .brushed-metal {
            background: linear-gradient(90deg, #d4d4d4 0%, #ffffff 20%, #a3a3a3 50%, #ffffff 80%, #d4d4d4 100%);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5), inset 0 -2px 4px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.5);
        }
        
        .matte-texture {
            background-blend-mode: multiply;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .tonearm-transition {
            /* Damped spring effect */
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

<script>
        const body = document.getElementById('app-body');
        const tonearm = document.getElementById('tonearm-assembly');
        const playBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const recordPlatter = document.getElementById('record-platter');
        const stateIndicator = document.getElementById('state-indicator');
        
        let isPlaying = true;
        
        // Physics for rotation
        let currentRotation = 0;
        let currentSpeed = 0.2; // roughly 33 1/3 RPM in deg/ms
        let targetSpeed = 0.2;
        let lastTime = performance.now();
        
        function updateRotation(time) {
            const dt = time - lastTime;
            lastTime = time;
            
            // Smooth acceleration/deceleration
            if (targetSpeed > currentSpeed) {
                currentSpeed += 0.00015 * dt; // Acceleration rate
                if (currentSpeed > targetSpeed) currentSpeed = targetSpeed;
            } else if (targetSpeed < currentSpeed) {
                currentSpeed -= 0.00008 * dt; // Natural deceleration rate (slower stop)
                if (currentSpeed < targetSpeed) currentSpeed = targetSpeed;
            }
            
            currentRotation += currentSpeed * dt;
            recordPlatter.style.transform = `rotate(${currentRotation}deg)`;
            
            requestAnimationFrame(updateRotation);
        }
        
        // Start animation loop
        requestAnimationFrame(updateRotation);

        if(playBtn) {
            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                
                if(isPlaying) {
                    // Play State
                    body.classList.add('is-playing');
                    body.classList.remove('is-paused');
                    
                    playIcon.textContent = 'pause';
                    stateIndicator.textContent = 'Playing';
                    stateIndicator.className = "text-xs tracking-[0.2em] uppercase font-label-caps bg-white/10 px-3 py-1 rounded-full text-white/90 border border-white/20 transition-colors duration-500 shadow-[0_0_10px_rgba(255,255,255,0.1)]";
                    
                    // Drop needle (moves to outer groove with spring physics via CSS)
                    tonearm.style.transform = 'rotate(16deg)';
                    
                    // Set target speed for acceleration
                    targetSpeed = 0.2;
                } else {
                    // Pause/Idle State
                    body.classList.remove('is-playing');
                    body.classList.add('is-paused');
                    
                    playIcon.textContent = 'play_arrow';
                    stateIndicator.textContent = 'Idle';
                    stateIndicator.className = "text-xs tracking-[0.2em] uppercase font-label-caps bg-black/30 px-3 py-1 rounded-full text-white/50 border border-white/5 transition-colors duration-500";
                    
                    // Lift and return tonearm to rest position
                    tonearm.style.transform = 'rotate(-8deg)';
                    
                    // Set target speed for natural deceleration
                    targetSpeed = 0;
                }
            });
        }
    </script>
