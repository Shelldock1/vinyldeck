<style>
        .vinyl-grooves {
            background: repeating-radial-gradient(
                #111 0%,
                #111 2%,
                #222 2.5%,
                #111 3%
            );
        }
        
        .bloom-effect {
            box-shadow: 0 0 100px 40px rgba(100, 150, 255, 0.1);
            transition: box-shadow 1s ease-in-out;
        }
        
        .bloom-effect.active {
            box-shadow: 0 0 120px 60px rgba(120, 180, 255, 0.2);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes shimmer {
            0% { opacity: 0.3; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.6; transform: scale(1.05) rotate(180deg); }
            100% { opacity: 0.3; transform: scale(1) rotate(360deg); }
        }

        .spinning {
            animation: spin 3s linear infinite;
        }
        
        .record-shimmer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.05) 45deg, transparent 90deg, rgba(255,255,255,0.02) 135deg, transparent 180deg, rgba(255,255,255,0.05) 225deg, transparent 270deg, rgba(255,255,255,0.02) 315deg, transparent 360deg);
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .record-shimmer.active {
            opacity: 1;
            animation: shimmer 6s linear infinite;
        }

        .glass-panel {
            background: rgba(20, 19, 19, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transition: box-shadow 0.8s ease;
        }
        
        .glass-panel.active {
            box-shadow: 0 -10px 40px -10px rgba(255,255,255,0.05);
        }
        
        .tonearm {
            transform-origin: top center;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .tonearm.playing {
            transform: rotate(25deg);
        }
        
        .tonearm.paused {
            transform: rotate(0deg);
        }
        
        .bg-ambient {
            transition: opacity 1.5s ease, filter 1.5s ease;
        }
        
        .bg-ambient.active {
            opacity: 0.5;
            filter: blur(40px) brightness(1.2);
        }
        
        .analog-noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('play-btn');
            const playIcon = playBtn.querySelector('span');
            const tonearm = document.getElementById('tonearm');
            const vinylRecord = document.getElementById('vinyl-record');
            const ambientBg = document.getElementById('ambient-bg');
            const glassControls = document.getElementById('glass-controls');
            const bloomElements = document.querySelectorAll('.bloom-effect');
            const recordShimmer = document.getElementById('record-shimmer');
            
            let isPlaying = false;
            let rotationAngle = 0;
            let animationFrameId;
            let lastTimestamp;

            function updateRotation(timestamp) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const deltaTime = timestamp - lastTimestamp;
                
                if (isPlaying) {
                    rotationAngle += (deltaTime * 0.1); // Adjust speed here
                    vinylRecord.style.transform = `rotate(${rotationAngle}deg)`;
                    animationFrameId = requestAnimationFrame(updateRotation);
                }
                lastTimestamp = timestamp;
            }

            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                
                if (isPlaying) {
                    playIcon.textContent = 'pause';
                    tonearm.classList.remove('paused');
                    tonearm.classList.add('playing');
                    ambientBg.classList.add('active');
                    glassControls.classList.add('active');
                    recordShimmer.classList.add('active');
                    bloomElements.forEach(el => el.classList.add('active'));
                    
                    lastTimestamp = performance.now();
                    animationFrameId = requestAnimationFrame(updateRotation);
                } else {
                    playIcon.textContent = 'play_arrow';
                    tonearm.classList.remove('playing');
                    tonearm.classList.add('paused');
                    ambientBg.classList.remove('active');
                    glassControls.classList.remove('active');
                    recordShimmer.classList.remove('active');
                    bloomElements.forEach(el => el.classList.remove('active'));
                    
                    cancelAnimationFrame(animationFrameId);
                    
                    // Simple inertia stop effect
                    const currentAngle = rotationAngle;
                    vinylRecord.style.transition = 'transform 2s cubic-bezier(0.25, 1, 0.5, 1)';
                    vinylRecord.style.transform = `rotate(${currentAngle + 45}deg)`;
                    rotationAngle = currentAngle + 45;
                    
                    setTimeout(() => {
                        vinylRecord.style.transition = '';
                    }, 2000);
                }
            });
        });
    </script>
