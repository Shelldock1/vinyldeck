<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            overflow-x: hidden;
        }
        
        /* Atmospheric Aurora Background */
        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(0, 219, 231, 0.05) 0%, transparent 60%);
        }
        .aurora-orb-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.08) 0%, transparent 70%);
            filter: blur(100px);
            mix-blend-mode: screen;
            animation: pulse 10s infinite alternate;
        }
        .aurora-orb-2 {
            position: absolute;
            bottom: -10%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(9, 82, 82, 0.15) 0%, transparent 70%);
            filter: blur(120px);
            mix-blend-mode: screen;
            animation: pulse 15s infinite alternate-reverse;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(15, 25, 30, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .luminous-top-border {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 219, 231, 0.4), transparent);
        }
